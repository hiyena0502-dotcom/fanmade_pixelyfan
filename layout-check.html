<!doctype html><html lang="ko"><meta charset="utf-8"><title>Layout verification</title><style>body{margin:0;padding:12px;background:#eee;font:14px system-ui}button{padding:8px;margin:0 6px 10px 0}#framebox{position:relative;overflow:hidden}iframe{border:0;transform-origin:0 0;display:block;background:white}</style><button data-w="1920" data-h="912">1920 × 912</button><button data-w="1363" data-h="936">1363 × 936</button><button data-w="1280" data-h="600">1280 × 600</button><button data-w="375" data-h="812">375 × 812</button><div id="framebox"><iframe title="Game preview" src="./index.html"></iframe></div><script>const f=document.querySelector('iframe'),box=document.querySelector('#framebox');let w=1920,h=912;function fit(){const s=Math.min(1,(innerWidth-24)/w);f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+s+')';box.style.width=w*s+'px';box.style.height=h*s+'px';}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{w=+b.dataset.w;h=+b.dataset.h;fit();});addEventListener('resize',fit);fit();</script></html>
