  </dialog><script src="./sounds.js"></script><script src="./settings.js"></script><script src="./front-scene.js"></script><script src="./chapter-title.js?v=floral-crest-37"></script><script>PixelyStage.setPlaying(true);const screen=document.getElementById('play-screen'),ct=PixelyChapterTitle.create(screen),clock=document.getElementById('clock');const scene={id:'front',builtin:'house'};PixelyFrontScene.renderBack(document.getElementById('scene-background'),scene);PixelyFrontScene.renderForeground(document.getElementById('scene-layers-front'),scene);let frame=0,hits=0;function still(t){cancelAnimationFrame(frame);ct.mount({number:0,title:'초대'});ct.seek(t);clock.value=t+'ms · 효과음 '+hits;}document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>still(Number(b.dataset.time)));document.getElementById('motion').onchange=e=>document.documentElement.classList.toggle('motions-off',e.target.checked);document.getElementById('play').onclick=async()=>{cancelAnimationFrame(frame);await PixelySettings.primeEffects();hits=0;ct.mount({number:0,title:'초대'});let start=performance.now(),before=0;function tick(now){const t=Math.min(4800,now-start);for(const hit of PixelyChapterTitle.crossed(before,t)){hits++;void PixelySettings.playEffect(hit.id);}ct.seek(t);clock.value=Math.round(t)+'ms · 효과음 '+hits;before=t;if(t<4800)frame=requestAnimationFrame(tick);else{ct.hide();clock.value='4800ms · 종료 · 효과음 '+hits;}}frame=requestAnimationFrame(tick);};Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>still(2400));</script></body></html>
