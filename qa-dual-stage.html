<!doctype html><meta charset="utf-8"><title>플레이 화면 비율 검증</title><style>body{margin:0;background:#eee;font:16px sans-serif}header{padding:10px}#frame{border:0;transform-origin:0 0}#view{width:1050px;height:450px;overflow:hidden}output{white-space:pre-wrap}</style><header><button id="run">플레이 비율 검증</button><output id="result">준비</output></header><div id="view"><iframe id="frame" src="qa-opening-inspection.html"></iframe></div><script>
const frame=document.querySelector('#frame'),out=document.querySelector('#result'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{let n=0;const check=(label,value)=>{if(!value)throw Error(label);out.textContent=++n+' checks · '+label;},until=async fn=>{for(let i=0;i<200&&!fn();i++)await sleep(40);if(!fn())throw Error('준비 대기 시간 초과');};try{for(const [w,h]of [[3440,1440],[2520,1080],[1920,1080],[1920,1200],[1600,1200],[800,600]]){
 frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+Math.min(1050/w,450/h)+')';await new Promise(r=>{frame.onload=r;frame.src='qa-opening-inspection.html?qa-size='+w;});const win=frame.contentWindow,d=frame.contentDocument;await win.PixelyGame.ready;const fit=()=>{const b=d.body.getBoundingClientRect();check('1920×1080 play coordinates',d.body.clientWidth===1920&&d.body.clientHeight===1080);check('16:9 without stretch',Math.abs(b.width/b.height-16/9)<.001);check('fits browser',b.left>=-.1&&b.top>=-.1&&b.right<=w+.1&&b.bottom<=h+.1);check('symmetric margins',Math.abs(b.left-(w-b.width)/2)<.1&&Math.abs(b.top-(h-b.height)/2)<.1);};
 check('slots use menu coordinates',d.body.clientWidth===3000&&d.body.clientHeight===1440);d.querySelector('#qa-proof').click();await until(()=>d.documentElement.classList.contains('opening-plain'));fit();check('opening exact brown',win.getComputedStyle(d.querySelector('#monologue-screen')).backgroundColor==='rgb(83, 68, 57)');d.querySelector('#qa-run').click();await until(()=>/passed|FAIL/.test(d.querySelector('#qa-result').textContent));check('opening investigation save regression',d.querySelector('#qa-result').textContent.includes('41 opening/inspection checks passed'));fit();check('green game pillars',win.getComputedStyle(d.documentElement).backgroundColor==='rgb(48, 58, 50)');
 const target=d.querySelector('[data-object=qa-open-door]'),r=target.getBoundingClientRect();check('base click target aligned',d.elementFromPoint(r.x+r.width/2,r.y+r.height/2)?.closest('[data-object=qa-open-door]')===target);target.click();await until(()=>!d.querySelector('#inspection-back').hidden);fit();check('parent targets blocked',!d.querySelector('[data-object=qa-open-door]'));check('detail image uses contain',win.getComputedStyle(d.querySelector('#scene-background img')).objectFit==='contain');const object=d.querySelector('[data-object=qa-inner-link]'),q=object.getBoundingClientRect();check('detail click target aligned',d.elementFromPoint(q.x+q.width/2,q.y+q.height/2)?.closest('[data-object=qa-inner-link]')===object);object.click();await until(()=>d.querySelectorAll('.object-target').length===0);fit();d.querySelector('#inspection-back').click();await until(()=>d.querySelector('[data-object=qa-inner-link]'));d.querySelector('#inspection-back').click();await until(()=>d.querySelector('[data-object=qa-open-door]'));check('same base restored',!!d.querySelector('[data-object=qa-open-door]'));
 }out.textContent=n+' play ratio checks passed';}catch(e){out.textContent='FAIL after '+n+': '+e.message;}};
</script>
