<!doctype html><meta charset="utf-8"><title>1920 × 911 PC book preview</title><style>html,body{margin:0;background:#f2f2f2}iframe{display:block;border:0;transform-origin:0 0}#framebox{overflow:hidden}</style><div id="framebox"><iframe title="PC book preview" src="./collection.html"></iframe></div><script>const f=document.querySelector('iframe'),b=document.querySelector('#framebox');function fit(){const s=Math.min(innerWidth/1920,innerHeight/911);f.style.width='1920px';f.style.height='911px';f.style.transform='scale('+s+')';b.style.width=1920*s+'px';b.style.height=911*s+'px';}addEventListener('resize',fit);fit();</script>
