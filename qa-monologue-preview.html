<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#777;width:1248px;padding-top:592.15px}iframe{width:1920px;height:911px;border:0;display:block;transform:scale(.65);transform-origin:0 0;position:absolute;top:0;left:0}</style></head><body><iframe id="frame" src="./qa-monologue.html?edit=1&editor=monologue"></iframe><button id="qa-layout" style="position:fixed;left:0;top:610px;z-index:1000">PC 비율·폰트 검증</button><output id="layout-result" style="position:fixed;left:190px;top:610px;z-index:1000;background:#fff4df"></output><script>
document.getElementById('qa-layout').onclick=async()=>{let count=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms)),assert=(name,v)=>{if(!v)throw Error(name);count++;};try{for(const [w,h]of [[1920,1080],[1440,900],[1280,1024],[2560,1080]])for(const page of ['index.html','chapters.html','collection.html','wardrobe.html']){const frame=document.createElement('iframe');frame.style.cssText='position:fixed;top:0;left:0;width:'+w+'px;height:'+h+'px;transform:scale(.3);z-index:-1';frame.src='./'+page;document.body.append(frame);await new Promise((ok,no)=>{frame.onload=ok;setTimeout(()=>no(Error('load '+page)),12000);});await sleep(100);const d=frame.contentDocument,win=frame.contentWindow;assert(page+' shared font',win.getComputedStyle(d.body).fontFamily.includes('Pixely Text'));assert(page+' formal title',d.title.includes('꿈뜰이의 우당탕탕 대환장 나들이!!'));const targets=page==='index.html'?[...d.querySelectorAll('.main-menu button')]:[d.querySelector(page==='wardrobe.html'?'.cabinet':'.book-shell'),...(page==='collection.html'?[d.querySelector('.collection-tabs')]:[])];for(const e of targets){const r=e.getBoundingClientRect();assert(page+' '+w+'x'+h+' within viewport',r.left>=-1&&r.top>=-1&&r.right<=w+1&&r.bottom<=h+1);}if(page==='index.html'){d.querySelector('[data-action=settings]').click();const r=d.querySelector('.settings-dialog').getBoundingClientRect();assert('settings fits '+w+'x'+h,r.left>=0&&r.top>=0&&r.right<=w&&r.bottom<=h);assert('settings shared font',win.getComputedStyle(d.querySelector('.settings-dialog')).fontFamily.includes('Pixely Text'));}frame.remove();}const f=document.getElementById('frame'),win=f.contentWindow,d=f.contentDocument;for(const [w,h]of [[1920,1080],[1440,900],[1280,1024],[2560,1080]]){f.style.width=w+'px';f.style.height=h+'px';await sleep(70);const s=d.getElementById('game-shell'),r=s.getBoundingClientRect();assert('game 16:9 at '+w+'x'+h,Math.abs(s.clientWidth/s.clientHeight-16/9)<.01&&r.left>=-1&&r.top>=-1&&r.right<=w+1&&r.bottom<=h+1);const G=win.PixelyGame;G.testScene(G.getData().start);const first=G.getData().locations.find(l=>l.id===G.getData().start).objects[0],target=d.querySelector('[data-object="'+first.id+'"]'),rect=target.getBoundingClientRect();assert('click area matches scaled scene '+w+'x'+h,Math.abs((rect.left-r.left)/r.width*100-first.rect.x)<.1&&Math.abs(rect.width/r.width*100-first.rect.w)<.1);target.click();assert('scaled target still starts event '+w+'x'+h,G.getState().run?.id===first.event);}f.style.width='1920px';f.style.height='911px';document.getElementById('layout-result').textContent=count+' layout checks passed';}catch(e){document.getElementById('layout-result').textContent='FAIL after '+count+': '+e.message;}};</script></body></html>
