<!doctype html><html lang="ko"><meta charset="utf-8"><title>일기장 레이아웃 확인</title><style>*{box-sizing:border-box}body{margin:0;background:#dedfcf;font:14px sans-serif;color:#4a583c}header{height:54px;display:flex;align-items:center;justify-content:center;gap:14px}select{font:inherit;padding:6px}#holder{position:absolute;top:54px;bottom:0;left:0;right:0;overflow:hidden}iframe{position:absolute;border:0;left:50%;top:50%;transform-origin:50% 50%}</style><header><label>화면 크기 <select id="size"><option value="1366,768" selected>1366 × 768</option><option value="1920,1080">1920 × 1080</option><option value="2560,1080">2560 × 1080</option><option value="3440,1440">3440 × 1440</option></select></label><label>화면 <select id="screen"><option value="./qa-title.html" selected>챕터</option><option value="./qa-title.html">콜렉션 · 미등록</option><option value="./qa-title.html?registered=1">콜렉션 · 등록</option><option value="./qa-title.html?mode=new">새 게임</option><option value="./qa-title.html?mode=continue">이어하기</option></select></label></header><div id="holder"><iframe id="preview" title="일기장 실제 레이아웃" src="./qa-title.html"></iframe></div><script>const f=document.getElementById('preview'),holder=document.getElementById('holder');function fit(){const [w,h]=document.getElementById('size').value.split(',').map(Number);f.width=w;f.height=h;f.style.transform='translate(-50%,-50%) scale('+Math.min(holder.clientWidth/w,holder.clientHeight/h)+')';}document.getElementById('size').onchange=fit;document.getElementById('screen').onchange=e=>{f.src=e.target.value;};addEventListener('resize',fit);fit();</script></html>
