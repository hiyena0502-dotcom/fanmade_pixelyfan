<!doctype html><html lang="ko"><meta charset="utf-8"><title>3000×1440 스테이지 검증</title><style>body{margin:0;background:#eee;font:16px sans-serif}header{padding:10px;display:flex;gap:10px;align-items:center}#view{position:relative;margin:0 10px;width:1050px;height:450px;background:#303A32;overflow:hidden}iframe{position:absolute;left:0;top:0;border:0;transform-origin:top left}output{white-space:pre-wrap}</style><header><button id="run">전체 비율 검증</button><button id="proof">21:9 메인 화면</button><button id="regular">플레이 테스트</button><output id="result">준비</output></header><div id="view"><iframe id="frame" title="실제 PC 표시 영역" src="./index.html" style="width:2520px;height:1080px;transform:scale(.4166666667)"></iframe></div><script>
const frame=document.getElementById('frame'),result=document.getElementById('result'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function open(page,w,h){frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+Math.min(1050/w,450/h)+')';await new Promise((ok,no)=>{frame.onload=ok;frame.src='./'+page;setTimeout(()=>no(Error('load '+page)),15000);});await sleep(150);return [frame.contentDocument,frame.contentWindow];}
document.getElementById('proof').onclick=()=>open('index.html',2520,1080);
document.getElementById('regular').onclick=()=>open('qa-regular.html?mode=new',1920,1080);
document.getElementById('run').onclick=async()=>{let count=0;const assert=(label,v)=>{if(!v)throw Error(label);count++;result.textContent=count+' checks · '+label;};const within=(r,b)=>r.left>=b.left-1&&r.top>=b.top-1&&r.right<=b.right+1&&r.bottom<=b.bottom+1;try{
for(const [w,h]of [[3440,1440],[2520,1080],[1920,1080],[1920,1200],[1600,1200],[800,600]])for(const page of ['index.html','chapters.html','collection.html','wardrobe.html','game.html?mode=new']){
const [d,win]=await open(page,w,h);await win.PixelyAdmin.ready;const r=d.body.getBoundingClientRect(),s=Math.min(w/3000,h/1440);assert(page+' design dimensions',d.body.clientWidth===3000&&d.body.clientHeight===1440);assert(page+' uniform fit '+w+'x'+h,Math.abs(r.width-3000*s)<.1&&Math.abs(r.height-1440*s)<.1&&within(r,{left:0,top:0,right:w,bottom:h}));assert(page+' equal margins',Math.abs(r.left-(w-r.right))<.1&&Math.abs(r.top-(h-r.bottom))<.1);assert(page+' pillar colour',win.getComputedStyle(d.documentElement).backgroundColor==='rgb(48, 58, 50)');assert(page+' outer margins contain no button',r.left<1||!d.elementFromPoint(r.left/2,h/2)?.closest('button,a'));
const selectors=page==='index.html'?['.house-touch','.bush-touch','.main-menu','.wardrobe-tag']:page==='wardrobe.html'?['.cabinet','.mirror-frame','.save-slots','[data-developer-login]']:page.startsWith('game')?['.game-shell','.slot-book','.return-link']:['.book-shell','.back-link','[data-developer-login]',...(page==='collection.html'?['.collection-tabs']:[])];for(const selector of selectors){const e=d.querySelector(selector);assert(page+' exists '+selector,!!e);assert(page+' fits '+selector,within(e.getBoundingClientRect(),r));}
if(page==='index.html'){const art=d.querySelector('.art-stage').getBoundingClientRect();assert('main art preserves native ratio',Math.abs(art.width/art.height-2048/983)<.0001);const target=d.querySelector('.house-touch');const hit=target.getBoundingClientRect();assert('house has aligned click target',d.elementFromPoint(hit.left+hit.width*.5,hit.top+hit.height*.5)?.closest('.house-touch')===target);target.click();assert('house click motion unchanged',d.querySelector('.layer-house').className.includes('boing')||d.querySelector('.layer-house').getAnimations().length>0);d.querySelector('[data-action=settings]').click();assert('settings opens',d.querySelector('.settings-dialog').open);assert('settings fits stage',within(d.querySelector('.settings-dialog').getBoundingClientRect(),r));d.querySelector('[data-developer-login]').click();for(let i=0;i<120&&!d.querySelector('.developer-login')?.open;i++)await sleep(50);assert('developer login preserved',d.querySelector('.developer-login').open);assert('developer login fits stage',within(d.querySelector('.developer-login').getBoundingClientRect(),r));}
if(page==='wardrobe.html'||page==='chapters.html'||page==='collection.html'){d.querySelector('[data-developer-login]').click();for(let i=0;i<120&&!d.querySelector('.developer-login')?.open;i++)await sleep(50);assert(page+' developer opens',d.querySelector('.developer-login').open);assert(page+' developer fits',within(d.querySelector('.developer-login').getBoundingClientRect(),r));}
if(page.startsWith('game')){const game=d.querySelector('.game-shell');assert('legacy play ratio preserved',Math.abs(game.clientWidth/game.clientHeight-16/9)<.001);assert('five save slots unchanged',d.querySelectorAll('#slot-list>button').length===5);}
const old={width:d.body.clientWidth,height:d.body.clientHeight};frame.style.width='1100px';frame.style.height='750px';await sleep(40);const rr=d.body.getBoundingClientRect();assert(page+' resize keeps logical coordinates',d.body.clientWidth===old.width&&d.body.clientHeight===old.height&&Math.abs(rr.width/rr.height-25/12)<.001&&within(rr,{left:0,top:0,right:1100,bottom:750}));
}
result.textContent=count+' stage checks passed';await open('index.html',2520,1080);
}catch(e){result.textContent='FAIL after '+count+': '+e.message;}};
</script></html>
