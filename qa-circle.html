<!doctype html><html lang="ko"><meta charset="utf-8"><title>원형 잎 날개 챕터 연출 검증</title><style>body{margin:0;background:#eae5dc;font:15px sans-serif}header{padding:10px;display:flex;gap:10px}button{padding:8px}#view{position:relative;width:1100px;height:619px;margin:10px;overflow:hidden}iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform:scale(.5729167);transform-origin:0 0}output{font-size:13px}</style><header><button id="start">동작 끄기 설정으로 시작</button><button id="resume">재생 계속</button><output id="result">준비</output></header><div id="view"><iframe id="frame" title="실제 프롤로그"></iframe></div><script>
const frame=document.querySelector('#frame'),result=document.querySelector('#result');let heard=[],seen=false,hold=true,paused=false,rotation=false,expanded=false,uiHidden=true,background=true,symmetric=false,glitter=false,settled=false,motionOff=false,feathers=false;let maxElapsed=0;
document.querySelector('#start').onclick=()=>{heard=[];seen=false;hold=true;paused=false;rotation=expanded=glitter=settled=symmetric=motionOff=feathers=false;maxElapsed=0;uiHidden=background=true;localStorage.setItem('pixely-settings-v1',JSON.stringify({masterVolume:80,effectsVolume:75,effectsEnabled:true,motion:false}));frame.src='qa-circle-game.html?mode=new';result.textContent='빈 슬롯을 골라 새 나들이 시작';};
document.querySelector('#resume').onclick=()=>{hold=false;frame.contentWindow.PixelyGame.pause(false);};
addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data.type==='qa-start')heard.push(e.data);});
function monitor(){const d=frame.contentDocument,w=frame.contentWindow,root=d?.querySelector('.chapter-title');if(root){seen=true;const elapsed=Number(root.dataset.elapsed);maxElapsed=Math.max(maxElapsed,elapsed);motionOff=d.body.classList.contains('motions-off');const orbit=root.querySelector('.ct-orbits');if(elapsed>500&&elapsed<1000)rotation||=Math.abs(new w.DOMMatrix(w.getComputedStyle(orbit).transform).b)>.02;if(elapsed>=1500){expanded=w.getComputedStyle(orbit).transform==='matrix(1, 0, 0, 1, 0, 0)';settled=w.getComputedStyle(root.querySelector('.ct-title')).opacity==='1';const l=root.querySelector('.ct-wing-left').getBoundingClientRect(),r=root.querySelector('.ct-wing-right').getBoundingClientRect(),box=root.getBoundingClientRect();symmetric=Math.abs(l.width-r.width)<1&&Math.abs((l.left-box.left)+(r.right-box.left)-box.width)<1;feathers=root.querySelectorAll('.ct-leaf').length===26;}if(elapsed>1850)glitter||=Number(w.getComputedStyle(root.querySelector('.ct-sweep')).opacity)>.3;uiHidden&&=w.getComputedStyle(d.querySelector('.play-tools')).visibility==='hidden';background&&=w.getComputedStyle(d.querySelector('.scene-background')).visibility==='visible';if(hold&&elapsed>=2250&&!paused){paused=true;w.PixelyGame.pause(true);result.textContent='완성 장식 고정 · '+JSON.stringify({motionOff,rotation,expanded,symmetric,glitter,feathers,elapsed});}}else if(seen){seen=false;const values={motionOff,rotation,expanded,symmetric,glitter,feathers,settled,uiHidden,background,sound:heard.length===1&&heard[0].elapsed>=1120&&heard[0].elapsed<=1220,end:maxElapsed>=4700&&!d.documentElement.classList.contains('chapter-title-active')&&!d.querySelector('#play-screen').hidden};result.textContent=(Object.values(values).every(Boolean)?'11 checks passed':'FAIL')+' · '+JSON.stringify(values);}requestAnimationFrame(monitor)}requestAnimationFrame(monitor);
</script></html>
