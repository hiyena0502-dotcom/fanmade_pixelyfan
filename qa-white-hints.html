document.querySelector('#verify').onclick=()=>{document.body.classList.remove('motions-off');for(const el of document.querySelectorAll('.hint'))el.hidden=false;const initial=document.querySelector('#door').getBoundingClientRect();let start=performance.now(),min=Infinity,max=0,fadeMin=Infinity,fadeMax=0;result.textContent='2.6초 동안 마름모 크기와 페이드 관찰';function sample(now){const style=getComputedStyle(hint),matrix=new DOMMatrix(style.transform),opacity=Number(getComputedStyle(hint,'::after').opacity);min=Math.min(min,matrix.a);max=Math.max(max,matrix.a);fadeMin=Math.min(fadeMin,opacity);fadeMax=Math.max(fadeMax,opacity);if(now-start<2600)return requestAnimationFrame(sample);const core=getComputedStyle(hint.querySelector('.hint-core')),before=getComputedStyle(hint,'::before'),after=getComputedStyle(hint,'::after'),final=document.querySelector('#door').getBoundingClientRect();const checks={white:[core,before,after].every(v=>v.backgroundColor==='rgb(255, 255, 255)'),layers:Number(core.opacity)>Number(before.opacity)&&Number(before.opacity)>fadeMax,larger:parseFloat(style.width)===34&&parseFloat(style.height)===54,pulse:max-min>.25,fade:fadeMax-fadeMin>.1,noPointerInterference:style.pointerEvents==='none'&&core.pointerEvents==='none',decorative:hint.getAttribute('aria-hidden')==='true',sameHitArea:initial.width===final.width&&initial.height===final.height&&initial.left===final.left&&initial.top===final.top};result.textContent=(Object.values(checks).every(Boolean)?'8 checks passed':'FAIL')+' · '+JSON.stringify({checks,min,max,fadeMin,fadeMax});}requestAnimationFrame(sample);};
