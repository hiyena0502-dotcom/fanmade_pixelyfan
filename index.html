<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#edf0d0" />
  <title>꿈뜰이의 우당탕탕 대환장 나들이!!</title>
  <link rel="stylesheet" href="./style.css?v=reset-006" />
</head>
<body>
  <main class="title-screen" id="title-screen">
    <div class="scene" aria-hidden="true">
      <img class="scene-layer scene-bg" src="./assets/title/scene-bg.png" alt="" />
      <img class="scene-layer scene-landscape" src="./assets/title/scene-landscape.png" alt="" />
      <img class="scene-layer scene-fence" src="./assets/title/scene-fence.png" alt="" />
      <img class="scene-layer scene-lawn" src="./assets/title/scene-lawn.png" alt="" />
      <div class="scene-house"><img src="./assets/title/scene-house.png" alt="" /></div>
      <div class="scene-bush bush-left"><img src="./assets/title/scene-bushes.png" alt="" /></div>
      <div class="scene-bush bush-right"><img src="./assets/title/scene-bushes.png" alt="" /></div>
    </div>

    <section class="hero" aria-labelledby="game-title">
      <div class="title-art"><img id="game-title" class="main-title" src="./assets/title/title-user-oct6.png" alt="꿈뜰이의 우당탕탕 대환장 나들이!!" /></div>
      <p class="subtitle">초대는 받았고, 귀가는 미정!</p>
      <p class="fan-label">잠뜰TV 13주년 기념 팬게임</p>
    </section>

    <section class="notebook" aria-label="메인 메뉴">
      <div class="notebook-page">
        <div class="ring-stack" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>

        <div class="menu-sheet">
          <header class="menu-head">
            <span class="menu-stamp">MENU</span>
            <p>원하는 메뉴를 골라 주세요.</p>
          </header>

          <nav class="main-menu">
            <button class="menu-item menu-new is-active" type="button" data-action="new">
              <span class="menu-icon">✦</span>
              <span class="menu-copy"><strong>새 게임</strong><small>처음부터 시작하기</small></span>
              <span class="menu-arrow">→</span>
            </button>

            <button class="menu-item menu-continue" type="button" data-action="continue">
              <span class="menu-icon">▶</span>
              <span class="menu-copy"><strong>이어하기</strong><small>마지막 기록에서 계속</small></span>
              <span class="menu-arrow">→</span>
            </button>

            <button class="menu-item menu-chapter" type="button" data-action="chapter">
              <span class="menu-icon">▣</span>
              <span class="menu-copy"><strong>챕터</strong><small>열린 챕터 확인하기</small></span>
              <span class="menu-arrow">→</span>
            </button>

            <button class="menu-item menu-wardrobe" type="button" data-action="wardrobe">
              <span class="menu-icon">♡</span>
              <span class="menu-copy"><strong>꿈뜰이 옷장</strong><small>꿈뜰이 꾸미기</small></span>
              <span class="menu-arrow">→</span>
            </button>

            <button class="menu-item menu-settings" type="button" data-action="settings">
              <span class="menu-icon">⚙</span>
              <span class="menu-copy"><strong>설정</strong><small>화면 · 소리 · 대사 설정</small></span>
              <span class="menu-arrow">→</span>
            </button>

            <button class="menu-item menu-soon" type="button" data-action="soon" disabled>
              <span class="menu-icon">…</span>
              <span class="menu-copy"><strong>추가 예정</strong><small>새 기능을 준비 중이에요</small></span>
              <span class="soon-badge">COMING SOON</span>
            </button>
          </nav>

          <button class="credits-link" type="button" data-action="credits">크레딧</button>
          <p class="menu-note" id="menu-note" aria-live="polite"></p>
        </div>
      </div>
    </section>
    <svg class="foreground-grass" aria-hidden="true" viewBox="0 0 740 230" xmlns="http://www.w3.org/2000/svg">
      <g fill="#76cbb0" stroke="#4c9f89" stroke-width="1.4">
        <path d="M142 230C141 171 128 132 89 104C132 116 151 153 158 230Z"/>
        <path d="M183 230C183 170 192 136 221 114C211 149 207 186 201 230Z"/>
        <path d="M265 230C262 174 272 117 302 63C289 134 290 182 284 230Z"/>
        <path d="M311 230C310 127 320 68 299 4C337 55 348 159 335 230Z"/>
        <path d="M363 230C349 140 337 89 338 38C361 90 373 139 382 230Z"/>
        <path d="M409 230C403 155 415 96 443 39C433 102 433 166 428 230Z"/>
        <path d="M434 230C447 143 472 99 527 75C485 123 467 177 454 230Z"/>
        <path d="M478 230C497 171 522 134 570 128C531 159 513 193 504 230Z"/>
        <path d="M535 230C524 174 535 113 570 91C551 143 555 186 554 230Z"/>
        <path d="M576 230C582 167 627 145 675 149C634 166 614 192 601 230Z"/>
        <path d="M637 230C636 168 652 96 686 55C665 116 665 175 658 230Z"/>
        <path d="M688 230C686 177 706 143 739 132C713 165 709 198 710 230Z"/>
        <path d="M64 230C67 191 62 162 32 152C71 153 85 187 84 230Z"/>
      </g>
    </svg>
  </main>
  <script src="./app.js?v=reset-006"></script>
</body>
</html>
