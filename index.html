          <span class="door-sign"><img draggable="false" src="./assets/title/door-sign-user-oct8.webp" alt="PIXELY" /></span>

        <img class="scene-layer layer-stones" draggable="false" src="./assets/title/layers-oct8/stones.webp" alt="" />

      <section class="hero" aria-labelledby="game-title">

        <img class="scene-layer layer-title" draggable="false" src="./assets/title/layers-oct8/title.webp" alt="꿈뜰이의 우당탕탕 대환장 나들이!!" />

      <div class="scene-interactions">

        <button class="house-touch" type="button" aria-label="집을 톡 건드리기"></button>
        <button class="bush-touch" type="button" aria-label="덤불을 부시럭거리기"></button>
      </div>
    </div>
    <div class="leaf-breeze" aria-hidden="true"></div>
    <div class="diary-positioner"><section class="notebook" aria-label="메인 메뉴">

        <span class="note-sticker sticker-daisy"><img draggable="false" src="./assets/title/diary-stickers-user-v2-oct8.webp" alt="" /></span>
        <span class="note-sticker sticker-vine"><img draggable="false" src="./assets/title/diary-stickers-user-v2-oct8.webp" alt="" /></span>
      </div>
      <header class="journal-heading">
        <p class="fan-label">fan made game</p>
        <h2 class="sr-only">잠뜰TV 13주년 ANNIVERSARY</h2>
        <div class="anniversary-art"><img draggable="false" src="./assets/title/anniversary-lettering-user-oct8.webp" alt="잠뜰TV 13주년 ANNIVERSARY" /></div>
      </header>
      <button class="menu-item wardrobe-tag" type="button" data-action="wardrobe" aria-label="꿈뜰이 옷장"><span class="wardrobe-backing"><img draggable="false" src="./assets/title/wardrobe-label-user-oct8.webp" alt="" /></span><span class="wardrobe-content"><span>꿈뜰이 옷장</span><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13 8a3 3 0 1 1 5 2l-2 2v3L3 25h26L16 15"/></svg></span></button>
      <nav class="main-menu" aria-label="게임 메뉴">
        <button class="menu-item menu-new is-active" type="button" data-action="new" aria-current="true">

        </button>
        <button class="menu-item menu-continue" type="button" data-action="continue">
          <span class="menu-content"><span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 5h14v23l-7-5-7 5Z"/><path d="M12 9h8"/></svg></span><span class="menu-name">이어하기</span></span>
        </button>
        <button class="menu-item menu-chapter" type="button" data-action="chapter">
          <span class="menu-content"><span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 9Q10 4 4 7v18q6-3 12 1 6-4 12-1V7q-6-3-12 2Zm0 0v17M8 12l4 1m-4 4 4 1m8-5 4-1m-4 6 4-1"/></svg></span><span class="menu-name">챕터</span></span>
        </button>
        <button class="menu-item menu-collection" type="button" data-action="collection">

        <button class="menu-item menu-settings" type="button" data-action="settings">

        </button>

    </section></div>
  </main>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title" aria-describedby="settings-description">
    <div class="settings-shell">
      <header class="settings-heading">
        <span class="settings-emblem" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="m13 4 6 0 1 4 4 2 4-1 3 5-3 3-1 4 2 3-5 4-3-2-4 1-2 3-6-2v-4l-3-3-4-1 1-6 4-1 2-3Z"/><circle cx="16" cy="17" r="4"/></svg></span>
        <div><h2 id="settings-title">설정</h2><p id="settings-description">나들이를 편하게 즐길 수 있게 골라줘요</p></div>
        <button type="button" class="settings-close" aria-label="설정 창 닫기" data-close-settings>×</button>
      </header>
      <nav class="settings-tabs" role="tablist" aria-label="설정 분류"><button id="tab-sound" role="tab" aria-selected="true" aria-controls="settings-sound" tabindex="0" type="button">소리</button><button id="tab-dialogue" role="tab" aria-selected="false" aria-controls="settings-dialogue" tabindex="-1" type="button">대사</button><button id="tab-effects" role="tab" aria-selected="false" aria-controls="settings-effects" tabindex="-1" type="button">연출</button><button id="tab-comfort" role="tab" aria-selected="false" aria-controls="settings-comfort" tabindex="-1" type="button">편의</button></nav>
      <div class="settings-panels"><section class="settings-panel" id="settings-sound" role="tabpanel" aria-labelledby="tab-sound"><div class="settings-row"><label for="setting-masterVolume">전체 음량</label><div class="settings-slider"><input id="setting-masterVolume" data-setting="masterVolume" type="range" min="0" max="100" step="1" /><output for="setting-masterVolume" data-output="masterVolume"></output></div></div><div class="settings-row"><label for="setting-effectsVolume">효과음</label><div class="settings-slider"><input id="setting-effectsVolume" data-setting="effectsVolume" type="range" min="0" max="100" step="1" /><output for="setting-effectsVolume" data-output="effectsVolume"></output></div></div><div class="settings-row"><label for="setting-textVolume">대사 출력음</label><div class="settings-slider"><input id="setting-textVolume" data-setting="textVolume" type="range" min="0" max="100" step="1" /><output for="setting-textVolume" data-output="textVolume"></output></div></div><div class="settings-row"><div class="setting-label" id="label-effectsEnabled">효과음 켜기<small>집과 덤불을 눌렀을 때 소리가 나요</small></div><label class="settings-switch"><input type="checkbox" data-setting="effectsEnabled" aria-labelledby="label-effectsEnabled" /><span class="switch-on" aria-hidden="true">켜기</span><span class="switch-off" aria-hidden="true">끄기</span></label></div><div class="settings-row sound-choice-row"><label for="setting-textSound">출력음 종류<small>대사 미리보기에서도 들을 수 있어요</small></label><div class="sound-choice"><select id="setting-textSound" data-setting="textSound"><option value="none">선택 안 함</option><option value="soft">다정한 옹알</option><option value="pixel">발랄한 옹알</option><option value="bubble">느긋한 옹알</option></select><button type="button" class="settings-small-button" data-sound-check="text" aria-label="출력음 종류 미리 듣기">미리 듣기</button></div></div></section><section class="settings-panel" id="settings-dialogue" role="tabpanel" aria-labelledby="tab-dialogue" hidden><div class="settings-row"><label for="setting-textSpeed">글자 표시 속도</label><select id="setting-textSpeed" data-setting="textSpeed"><option value="15">느리게</option><option value="35">보통</option><option value="65">빠르게</option><option value="0">즉시 표시</option></select></div><div class="settings-row"><label for="setting-textSize">대사 글자 크기</label><select id="setting-textSize" data-setting="textSize"><option value="18">작게</option><option value="22">보통</option><option value="26">크게</option></select></div><div class="settings-row"><label for="setting-autoDelay">자동 진행 대기 시간<small>대사가 모두 나온 뒤 기다리는 시간</small></label><div class="settings-slider"><input id="setting-autoDelay" data-setting="autoDelay" type="range" min="500" max="5000" step="500" /><output for="setting-autoDelay" data-output="autoDelay"></output></div></div><div class="dialogue-preview"><span class="dialogue-preview-label">대사 미리보기</span><button type="button" class="settings-small-button" data-replay-preview>다시 보기</button><p class="dialogue-preview-text">초대는 받았고, 귀가는 미정!</p></div></section><section class="settings-panel" id="settings-effects" role="tabpanel" aria-labelledby="tab-effects" hidden><div class="settings-row"><div class="setting-label" id="label-motion">모션<small>제목·집·덤불·팻말·나뭇잎·굴뚝 연기</small></div><label class="settings-switch"><input type="checkbox" data-setting="motion" aria-labelledby="label-motion" /><span class="switch-on" aria-hidden="true">켜기</span><span class="switch-off" aria-hidden="true">끄기</span></label></div></section><section class="settings-panel" id="settings-comfort" role="tabpanel" aria-labelledby="tab-comfort" hidden><div class="settings-row"><div class="setting-label" id="label-interactionHints">조사 가능한 곳 표시<small>클릭할 수 있는 곳에 작은 표시를 붙여요</small></div><label class="settings-switch"><input type="checkbox" data-setting="interactionHints" aria-labelledby="label-interactionHints" /><span class="switch-on" aria-hidden="true">켜기</span><span class="switch-off" aria-hidden="true">끄기</span></label></div><div class="settings-row"><div class="setting-label" id="label-skipReadOnly">읽은 대사만 건너뛰기<small>처음 보는 대사는 건너뛰지 않아요</small></div><label class="settings-switch"><input type="checkbox" data-setting="skipReadOnly" aria-labelledby="label-skipReadOnly" /><span class="switch-on" aria-hidden="true">켜기</span><span class="switch-off" aria-hidden="true">끄기</span></label></div><div class="settings-row"><div class="setting-label" id="label-autoSave">자동 저장<small>게임 진행 중 자동 저장을 사용해요</small></div><label class="settings-switch"><input type="checkbox" data-setting="autoSave" aria-labelledby="label-autoSave" /><span class="switch-on" aria-hidden="true">켜기</span><span class="switch-off" aria-hidden="true">끄기</span></label></div></section></div>
      <footer class="settings-footer"><button type="button" class="settings-small-button" data-reset-settings>기본값으로</button><button class="developer-link" type="button" data-developer-login>개발자 모드</button><p class="settings-status" role="status" aria-live="polite">변경하면 바로 저장돼요</p><button type="button" class="settings-done" data-close-settings>완료</button></footer>
    </div>
  </dialog>
