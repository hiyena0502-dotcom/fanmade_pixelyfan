<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#b9e8f6" />
  <title>꿈뜰이의 대환장 나들이</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="title-screen" id="title-screen">
    <div class="morning-sky" aria-hidden="true">
      <div class="sun"></div>
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <div class="cloud cloud-c"></div>
      <div class="far-hill far-hill-a"></div>
      <div class="far-hill far-hill-b"></div>
    </div>

    <img class="lawn-art" src="./assets/title/lawn.png" alt="" aria-hidden="true" />
    <img class="house-art" src="./assets/title/house.png" alt="" aria-hidden="true" />

    <div class="scene-doodle doodle-one" aria-hidden="true">✦</div>
    <div class="scene-doodle doodle-two" aria-hidden="true">?</div>
    <div class="scene-doodle doodle-three" aria-hidden="true">↝</div>

    <section class="title-content" aria-labelledby="game-title">
      <p class="anniversary">잠뜰TV 13주년 기념 팬게임</p>

      <div class="logo-wrap">
        <span class="logo-kicker">꿈뜰이의</span>

        <h1 id="game-title">
          <span class="logo-chaos">대환장</span>
          <span class="logo-trip">나들이</span>
        </h1>

        <span class="logo-bang" aria-hidden="true">!</span>
        <span class="logo-spark logo-spark-a" aria-hidden="true">★</span>
        <span class="logo-spark logo-spark-b" aria-hidden="true">✦</span>

        <p class="subtitle">초대는 받았고, 귀가는 미정!</p>
      </div>

      <div class="menu-board">
        <span class="tape tape-a" aria-hidden="true"></span>
        <span class="tape tape-b" aria-hidden="true"></span>

        <nav class="main-menu" aria-label="메인 메뉴">
          <button class="menu-item is-active" type="button" data-placeholder="새 게임">
            <span class="menu-number">01</span>
            <span class="menu-label">새 게임</span>
            <span class="menu-arrow" aria-hidden="true">→</span>
          </button>

          <button class="menu-item" type="button" data-placeholder="이어하기">
            <span class="menu-number">02</span>
            <span class="menu-label">이어하기</span>
            <span class="menu-arrow" aria-hidden="true">→</span>
          </button>

          <button class="menu-item" type="button" data-placeholder="설정">
            <span class="menu-number">03</span>
            <span class="menu-label">설정</span>
            <span class="menu-arrow" aria-hidden="true">→</span>
          </button>

          <button class="menu-item" type="button" data-placeholder="크레딧">
            <span class="menu-number">04</span>
            <span class="menu-label">크레딧</span>
            <span class="menu-arrow" aria-hidden="true">→</span>
          </button>
        </nav>

        <p class="menu-note" id="menu-note" aria-live="polite">
          메인 화면 디자인 프로토타입
        </p>
      </div>
    </section>

    <div class="corner-note" aria-hidden="true">
      <strong>12.28</strong>
      <span>오늘도 무사히 귀가할 수 있을까?</span>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
