                  <path d="m31 131 3 6 6 3-6 3-3 6-3-6-6-3 6-3Zm398 0 3 6 6 3-6 3-3 6-3-6-6-3 6-3ZM145 35l2 5 5 2-5 2-2 5-2-5-5-2 5-2Zm170 0 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" />
                </g>
              </svg>
              <strong class="chapter-number" id="chapter-number" aria-label="챕터 1">I</strong>
              <span class="chapter-glint" aria-hidden="true"></span>
            </div>
            <h2 class="chapter-title" id="chapter-title">생일 준비</h2>
            <svg class="chapter-flourish" viewBox="0 0 460 36" fill="none" aria-hidden="true">
              <path d="M12 18h153c22 0 27-13 39-13 8 0 13 5 13 13M448 18H295c-22 0-27-13-39-13-8 0-13 5-13 13M76 24h95c18 0 24 7 32 7m181-7h-95c-18 0-24 7-32 7" stroke="currentColor" />
              <path d="m230 8 5 10-5 10-5-10ZM6 15l3 3-3 3-3-3Zm448 0 3 3-3 3-3-3Z" fill="currentColor" />
            </svg>
          </div>
        </section>

        <aside class="quest-notice" id="quest-notice" aria-live="polite" aria-atomic="true"><span>새 할 일</span><strong id="quest-notice-title"></strong></aside>
        <button type="button" class="hint-trigger" id="quest-hint-button" aria-label="힌트 보기"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 8a3 3 0 0 1 6 0c0 2-3 2-3 5M12 17h.01" /></svg></button>
        <div class="panel-backdrop" id="panel-backdrop" hidden aria-hidden="true"></div>
        <section class="choice-sheet" id="door-choice" role="dialog" aria-modal="true" aria-label="입장 선택" tabindex="-1" hidden>
          <div><button type="button" id="enter-house">들어간다</button><button type="button" id="keep-looking">그래도 조금 더 둘러본다</button></div>
        </section>
        <section class="menu-sheet" id="story-menu" role="dialog" aria-modal="true" aria-labelledby="story-menu-title" tabindex="-1" hidden>
          <header>
            <strong id="story-menu-title">메뉴</strong>
          </header>
          <button type="button" id="save-progress">현재 위치 저장</button>
          <button type="button" id="toggle-motion" aria-pressed="true">애니메이션: 켜짐</button>
          <button type="button" id="replay-chapter">챕터 연출 다시 보기</button>
          <button type="button" id="return-home">메인 화면으로</button>
        </section>
        <section class="tool-sheet" id="tool-sheet" role="dialog" aria-modal="true" aria-labelledby="tool-title" tabindex="-1" hidden>
          <header><h2 id="tool-title"></h2></header>
          <div id="tool-content"></div>
        </section>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" aria-live="polite"></div>
</body>
</html>
