<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#aee5f5" />
  <title>꿈뜰이의 대환장 나들이</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="title-screen" id="title-screen">
    <div class="sky" aria-hidden="true">
      <div class="sun"></div>
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <div class="cloud cloud-c"></div>
      <div class="far-hill far-hill-a"></div>
      <div class="far-hill far-hill-b"></div>
    </div>

    <section class="meadow" aria-hidden="true">
      <div class="meadow-back"></div>
      <div class="meadow-front"></div>

      <div class="path">
        <i class="step s1"></i>
        <i class="step s2"></i>
        <i class="step s3"></i>
        <i class="step s4"></i>
        <i class="step s5"></i>
        <i class="step s6"></i>
        <i class="step s7"></i>
      </div>

      <div class="flower f1">✿</div>
      <div class="flower f2">✿</div>
      <div class="flower f3">✿</div>
      <div class="flower f4">✿</div>
      <div class="flower f5">✿</div>
      <div class="flower f6">✿</div>
      <div class="flower f7">✿</div>
      <div class="flower f8">✿</div>

      <div class="grass g1">︿</div>
      <div class="grass g2">︿</div>
      <div class="grass g3">︿</div>
      <div class="grass g4">︿</div>
      <div class="grass g5">︿</div>
      <div class="grass g6">︿</div>
    </section>

    <section class="house-stage" aria-hidden="true">
      <div class="house-shadow"></div>
      <img class="house-art" src="./assets/title/house.webp" alt="" />
      <div class="tiny-note note-one">!</div>
      <div class="tiny-note note-two">?</div>
    </section>

    <section class="title-content" aria-labelledby="game-title">
      <p class="anniversary">잠뜰TV 13주년 기념 팬게임</p>

      <div class="logo-wrap">
        <span class="logo-kicker">꿈뜰이의</span>
        <h1 id="game-title">
          <span class="logo-chaos">대환장</span>
          <span class="logo-trip">나들이</span>
        </h1>
        <span class="logo-bang" aria-hidden="true">!</span>
        <span class="logo-spark spark-a" aria-hidden="true">✦</span>
        <span class="logo-spark spark-b" aria-hidden="true">✧</span>
        <p class="subtitle">초대는 받았고, 귀가는 미정!</p>
      </div>

      <nav class="main-menu" aria-label="메인 메뉴">
        <button class="menu-item is-active" type="button" data-placeholder="새 게임">
          <span class="menu-mark">✦</span>
          <span class="menu-label">새 게임</span>
          <span class="menu-arrow">→</span>
        </button>
        <button class="menu-item" type="button" data-placeholder="이어하기">
          <span class="menu-mark">✦</span>
          <span class="menu-label">이어하기</span>
          <span class="menu-arrow">→</span>
        </button>
        <button class="menu-item" type="button" data-placeholder="설정">
          <span class="menu-mark">✦</span>
          <span class="menu-label">설정</span>
          <span class="menu-arrow">→</span>
        </button>
        <button class="menu-item" type="button" data-placeholder="크레딧">
          <span class="menu-mark">✦</span>
          <span class="menu-label">크레딧</span>
          <span class="menu-arrow">→</span>
        </button>
      </nav>

      <p class="menu-note" id="menu-note" aria-live="polite">메인 화면 디자인 프로토타입</p>
    </section>

    <div class="corner-doodle corner-doodle-a" aria-hidden="true">↝</div>
    <div class="corner-doodle corner-doodle-b" aria-hidden="true">✦</div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
