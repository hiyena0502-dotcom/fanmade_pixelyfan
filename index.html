<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="잠뜰님의 생일을 준비하는 비공식 팬메이드 포인트앤클릭 어드벤처." />
  <meta name="theme-color" content="#17223d" />
  <title>꿈뜰이의 우당탕 생일 준비 대작전!!</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="image" href="assets/home/home-bg.png?v=84" />
  <link rel="preload" as="image" href="assets/story/chapter1/living-room.webp?v=87" />
  <link rel="preload" as="image" href="assets/ui/opening-title.webp?v=81" />
  <link rel="preload" as="image" href="assets/home/home-bg.webp?v=84" />
  <link rel="stylesheet" href="styles/rebuild.css?v=87" />
  <script src="rebuild.js?v=87" defer></script>
</head>
<body>
  <main class="rebuild-root">
    <section class="screen home-screen is-active" data-screen="home">
      <div class="home-illustration-slot" aria-hidden="true"></div>

      <div class="home-copy">
        <header class="home-title">
          <img src="assets/home/title-logo.png?v=83" alt="꿈뜰이의 우당탕 생일 준비 대작전!!" />
        </header>

        <nav class="home-menu" aria-label="메인 메뉴">
          <button class="title-menu-item" type="button" id="new-story">
            <span class="menu-mark">✦</span>
            <strong>새 이야기</strong>
            <small>NEW STORY</small>
          </button>
          <button class="title-menu-item" type="button" id="continue-story" disabled>
            <span class="menu-mark">✦</span>
            <strong>이어하기</strong>
            <small id="continue-copy">NO SAVE DATA</small>
          </button>
          <a class="title-menu-item" href="wardrobe.html">
            <span class="menu-mark">✦</span>
            <strong>꿈뜰이 옷장</strong>
            <small>DRESS UP</small>
          </a>
        </nav>
      </div>
    </section>

    <section class="screen story-screen" data-screen="story" hidden>
      <div class="story-frame">
        <div class="game-frame-ui" aria-hidden="true">
          <i class="frame-corner frame-corner--tl"></i>
          <i class="frame-corner frame-corner--tr"></i>
          <i class="frame-corner frame-corner--bl"></i>
          <i class="frame-corner frame-corner--br"></i>
        </div>

        <header class="minimal-hud">
          <div class="hud-date">
            <span class="hud-date-stamp">12 · 28</span>
            <span class="hud-place-copy">
              <small>PIXELY HOUSE</small>
              <strong id="hud-place">픽셀리 집 앞</strong>
            </span>
          </div>

          <nav class="hud-tools" aria-label="게임 도구">
            <div class="inventory-rack" aria-hidden="true">
              <span>ITEMS</span>
              <i></i><i></i><i></i>
            </div>
            <button type="button" class="object-tool" id="bag-button" aria-label="가방" disabled><span>▣</span><small>가방</small></button>
            <button type="button" class="object-tool" id="diary-button" aria-label="다이어리" disabled><span>▤</span><small>기록</small></button>
            <button type="button" class="object-tool" id="story-menu-button" aria-label="메뉴"><span>☰</span><small>메뉴</small></button>
          </nav>
        </header>

        <section class="scene exterior-scene is-active" data-scene="exterior" aria-label="픽셀리 집 앞">
          <img class="scene-art" src="assets/story/chapter1/house-wide.webp?v=75" alt="눈 덮인 픽셀리 집의 아침 풍경" />
          <button type="button" class="hotspot hotspot-door" id="door-hotspot" aria-label="현관문 살펴보기"></button>
          <div class="inspect-bubble" id="inspect-bubble" role="status" aria-live="polite" hidden></div>
        </section>

        <section class="scene living-room-scene" data-scene="living-room" hidden aria-label="픽셀리 집 거실">
          <img class="scene-art living-room-art" src="assets/story/chapter1/living-room.webp?v=86" alt="따뜻한 겨울 아침의 픽셀리 집 거실" />
          <button type="button" class="scene-back-arrow" id="leave-house" aria-label="집 밖으로 나가기">
            <span>⌄</span><small>밖으로</small>
          </button>
        </section>

        <section class="story-dialogue-ui" id="story-dialogue-ui" hidden aria-live="polite">
          <div class="dialogue-character dialogue-character--left" id="dialogue-character-left" hidden>
            <img id="dialogue-character-left-image" alt="" />
          </div>
          <div class="dialogue-character dialogue-character--right" id="dialogue-character-right" hidden>
            <img id="dialogue-character-right-image" alt="" />
          </div>
          <div class="dialogue-rail" aria-hidden="true"><span></span><i>✦</i><span></span></div>
          <div class="dialogue-copy">
            <strong id="dialogue-speaker"></strong>
            <p id="dialogue-text"></p>
            <button type="button" id="dialogue-next" aria-label="다음 대사">›</button>
          </div>
        </section>

        <section class="choice-sheet" id="door-choice" hidden aria-live="polite">
          <p>집 안으로 들어갈까?</p>
          <div>
            <button type="button" id="enter-house">들어간다</button>
            <button type="button" id="keep-looking">조금 더 둘러본다</button>
          </div>
        </section>

        <section class="intro-monologue" id="intro-monologue" hidden aria-live="polite" aria-label="꿈뜰이 독백">
          <div class="intro-monologue-box">
            <p id="intro-monologue-text"></p>
          </div>
        </section>

        <section class="opening-title-card" id="opening-title-card" hidden aria-hidden="true">
          <img src="assets/home/title-logo.png?v=85" alt="꿈뜰이의 우당탕 생일 준비 대작전!!" loading="eager" decoding="async" />
        </section>

        <div class="house-entry-transition" id="house-entry-transition" hidden aria-hidden="true">
          <span class="entry-vignette"></span>
        </div>

        <section class="chapter-card" id="chapter-card" hidden aria-live="polite">
          <div class="chapter-lines" aria-hidden="true"><i></i><span>✦</span><i></i></div>
          <small>DECEMBER 28</small>
          <strong>CHAPTER I</strong>
          <span>생일 준비</span>
          <em>Birthday Preparation</em>
        </section>

        <section class="menu-sheet" id="story-menu" hidden>
          <header>
            <strong>메뉴</strong>
            <button type="button" id="close-story-menu" aria-label="메뉴 닫기">×</button>
          </header>
          <button type="button" id="save-progress">현재 위치 저장</button>
          <button type="button" id="return-home">메인 화면으로</button>
        </section>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" aria-live="polite"></div>
</body>
</html>
