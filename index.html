<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="잠뜰님의 생일을 준비하는 비공식 팬메이드 포인트앤클릭 어드벤처." />
  <meta name="theme-color" content="#17223d" />
  <title>꿈뜰이의 우당탕 생일 준비 대작전!!</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="image" href="assets/home/home-bg.png?v=85" />
  <link rel="preload" as="image" href="assets/story/chapter1/living-room.webp?v=90" />
  <link rel="preload" as="image" href="assets/story/chapter1/house-wide-v108.png" />
  <link rel="stylesheet" href="styles/rebuild.css?v=118" />
  <script src="rebuild.js?v=116" defer></script>
</head>
<body>
  <main class="rebuild-root">
    <section class="screen home-screen is-active" data-screen="home">
      <div class="home-illustration-slot" aria-hidden="true"></div>
      <div class="home-snow" id="home-snow" aria-hidden="true"></div>

      <div class="home-copy">
        <header class="home-title">
          <img src="assets/home/title-logo.png?v=83" alt="꿈뜰이의 우당탕 생일 준비 대작전!!" />
        </header>

        <nav class="home-menu" aria-label="메인 메뉴">
          <button class="title-menu-item" type="button" id="new-story">
            <span class="menu-mark">✦</span>
            <strong>새 이야기</strong>
            <small>NEW STORY</small>
          </button>
          <button class="title-menu-item" type="button" id="continue-story" disabled>
            <span class="menu-mark">✦</span>
            <strong>이어하기</strong>
            <small id="continue-copy">NO SAVE DATA</small>
          </button>
          <a class="title-menu-item" href="wardrobe.html">
            <span class="menu-mark">✦</span>
            <strong>꿈뜰이 옷장</strong>
            <small>DRESS UP</small>
          </a>
        </nav>
      </div>
    </section>

    <section class="screen story-screen" data-screen="story" hidden>
      <div class="story-frame">
        <div class="game-frame-ui" aria-hidden="true">
          <i class="frame-corner frame-corner--tl"></i>
          <i class="frame-corner frame-corner--tr"></i>
          <i class="frame-corner frame-corner--bl"></i>
          <i class="frame-corner frame-corner--br"></i>
        </div>

        <header class="minimal-hud">
          <div class="hud-date">
            <span class="hud-date-stamp">12 · 28</span>
            <span class="hud-place-copy">
              <small>PIXELY HOUSE</small>
              <strong id="hud-place">픽셀리 집 앞</strong>
            </span>
          </div>

          <div class="inventory-rack" aria-hidden="true">
            <span>아이템</span>
            <i></i><i></i><i></i><i></i>
          </div>

          <nav class="hud-tools" aria-label="게임 도구">
            <button type="button" class="object-tool" id="bag-button" aria-label="가방" disabled><span class="tool-icon tool-icon--bag" aria-hidden="true"></span><small>가방</small></button>
            <button type="button" class="object-tool" id="diary-button" aria-label="다이어리" disabled><span class="tool-icon tool-icon--diary" aria-hidden="true"></span><small>기록</small></button>
            <button type="button" class="object-tool" id="story-menu-button" aria-label="메뉴"><span class="tool-icon tool-icon--menu" aria-hidden="true"></span><small>메뉴</small></button>
          </nav>
        </header>

        <section class="scene exterior-scene is-active" data-scene="exterior" aria-label="픽셀리 집 앞">
          <div class="scene-art-stage exterior-stage">
          <img class="scene-art" src="assets/story/chapter1/house-wide-v108.png" width="2048" height="1152" alt="눈 덮인 픽셀리 집의 아침 풍경" draggable="false" />
          <button type="button" class="hotspot hotspot-door" id="door-hotspot" aria-label="현관문 살펴보기"></button>
          </div>
        </section>

        <section class="scene door-closeup-scene" data-scene="door-closeup" hidden aria-label="픽셀리 집 현관문">
          <div class="door-closeup-stage">
            <img class="door-closeup-art" src="assets/story/chapter1/door-closeup-v108.png" width="1672" height="941" alt="꽃과 화분이 놓인 픽셀리 집 현관문" draggable="false" />
            <button type="button" class="hotspot hotspot-door-closeup" id="door-closeup-hotspot" aria-label="현관문 두드리기"></button>
          </div>
          <button type="button" class="scene-back-arrow door-closeup-back" id="door-closeup-back" aria-label="집 앞으로 돌아가기">
            <span>‹</span><small>집 앞</small>
          </button>
          <section class="choice-sheet" id="door-choice" role="dialog" aria-modal="true" aria-labelledby="door-choice-title" hidden>
            <p id="door-choice-title">집 안으로 들어갈까?</p>
            <div>
              <button type="button" id="enter-house">들어간다</button>
              <button type="button" id="keep-looking">조금 더 둘러본다</button>
            </div>
          </section>
        </section>

        <section class="scene living-room-scene" data-scene="living-room" hidden aria-label="픽셀리 집 거실">
          <img class="scene-art living-room-art" src="assets/story/chapter1/living-room.webp?v=90" alt="따뜻한 겨울 아침의 픽셀리 집 거실" draggable="false" />
          <button type="button" class="scene-back-arrow" id="leave-house" aria-label="집 밖으로 나가기">
            <span>⌄</span><small>밖으로</small>
          </button>
        </section>

        <section class="intro-monologue" id="intro-monologue" hidden aria-live="polite" aria-label="꿈뜰이 독백">
          <div class="intro-monologue-box">
            <p id="intro-monologue-text"></p>
          </div>
        </section>
<div class="house-entry-transition" id="house-entry-transition" hidden aria-hidden="true">
          <span class="entry-vignette"></span>
        </div>

        <section class="chapter-card" id="chapter-card" hidden aria-live="polite" aria-atomic="true">
          <div class="chapter-emblem">
            <div class="chapter-kicker" aria-hidden="true"><span></span>CHAPTER<span></span></div>
            <div class="chapter-crest">
              <div class="chapter-halo" aria-hidden="true"></div>
              <svg class="chapter-ornament" viewBox="0 0 460 280" fill="none" aria-hidden="true">
                <g class="chapter-orbits" stroke="currentColor">
                  <circle cx="230" cy="140" r="110" />
                  <circle cx="230" cy="140" r="100" stroke-dasharray="1 11" stroke-linecap="round" />
                  <path d="M230 19v-10m0 262v-10M109 140H99m262 0h-10" />
                  <path d="m230 0 5 9-5 9-5-9Zm0 262 5 9-5 9-5-9Z" fill="currentColor" stroke="none" />
                </g>
                <g class="chapter-laurels" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M180 246C91 226 57 154 86 65M280 246c89-20 123-92 94-181" />
                  <path id="chapter-laurel-left" d="M89 80c-20-4-24-21-18-35 15 10 20 21 18 35Zm-8 27c-22-3-32-18-31-33 20 5 30 16 31 33Zm-3 28c-26 0-37-12-40-28 22 1 34 11 40 28Zm3 29c-25 6-42-5-48-19 22-5 38 2 48 19Zm10 27c-23 12-42 8-52-4 20-11 37-8 52 4Zm18 25c-18 17-37 20-50 11 15-16 33-19 50-11Zm25 18c-12 22-30 29-45 24 10-20 26-28 45-24Zm28 10c-4 24-18 37-34 36 3-23 15-35 34-36Z" />
                  <use href="#chapter-laurel-left" transform="translate(460 0) scale(-1 1)" />
                </g>
                <g class="chapter-stars" fill="currentColor">
                  <path d="m31 131 3 6 6 3-6 3-3 6-3-6-6-3 6-3Zm398 0 3 6 6 3-6 3-3 6-3-6-6-3 6-3ZM145 35l2 5 5 2-5 2-2 5-2-5-5-2 5-2Zm170 0 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" />
                </g>
              </svg>
              <strong class="chapter-number" id="chapter-number" aria-label="챕터 1">I</strong>
              <span class="chapter-glint" aria-hidden="true"></span>
            </div>
            <h2 class="chapter-title" id="chapter-title">생일 준비</h2>
            <svg class="chapter-flourish" viewBox="0 0 460 36" fill="none" aria-hidden="true">
              <path d="M12 18h153c22 0 27-13 39-13 8 0 13 5 13 13M448 18H295c-22 0-27-13-39-13-8 0-13 5-13 13M76 24h95c18 0 24 7 32 7m181-7h-95c-18 0-24 7-32 7" stroke="currentColor" />
              <path d="m230 8 5 10-5 10-5-10ZM6 15l3 3-3 3-3-3Zm448 0 3 3-3 3-3-3Z" fill="currentColor" />
            </svg>
          </div>
        </section>

        <div class="panel-backdrop" id="panel-backdrop" hidden aria-hidden="true"></div>
        <section class="menu-sheet" id="story-menu" role="dialog" aria-modal="true" aria-labelledby="story-menu-title" tabindex="-1" hidden>
          <header>
            <strong id="story-menu-title">메뉴</strong>
          </header>
          <button type="button" id="save-progress">현재 위치 저장</button>
          <button type="button" id="return-home">메인 화면으로</button>
          <p class="panel-hint">창 밖을 누르면 닫혀요</p>
        </section>
        <section class="tool-sheet" id="tool-sheet" role="dialog" aria-modal="true" aria-labelledby="tool-title" tabindex="-1" hidden>
          <header><h2 id="tool-title"></h2></header>
          <div id="tool-content"></div>
          <p class="panel-hint">창 밖을 누르면 닫혀요</p>
        </section>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" aria-live="polite"></div>
</body>
</html>
