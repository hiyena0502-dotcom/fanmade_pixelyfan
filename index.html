<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="잠뜰님의 생일을 준비하는 비공식 팬메이드 포인트앤클릭 어드벤처." />
  <meta name="theme-color" content="#cfe8f2" />
  <title>꿈뜰이의 우당탕 생일 준비 대작전!!</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/rebuild.css?v=76" />
  <script src="rebuild.js?v=76" defer></script>
</head>
<body>
  <main class="rebuild-root">
    <section class="screen home-screen is-active" data-screen="home">
      <div class="home-sky" aria-hidden="true">
        <span class="home-moon"></span>
        <span class="home-star star-a">✦</span>
        <span class="home-star star-b">·</span>
        <span class="home-star star-c">✧</span>
        <span class="home-horizon"></span>
      </div>

      <header class="home-title">
        <img src="assets/home/title-logo.png?v=75" alt="꿈뜰이의 우당탕 생일 준비 대작전!!" />
        <p>12월 28일, 생일 당일 아침.</p>
      </header>

      <nav class="home-menu" aria-label="메인 메뉴">
        <button class="paper-button primary" type="button" id="new-story">
          <strong>새 이야기</strong>
          <span>12월 28일 아침부터 시작</span>
        </button>
        <button class="paper-button" type="button" id="continue-story" disabled>
          <strong>이어하기</strong>
          <span id="continue-copy">저장된 이야기가 없습니다</span>
        </button>
        <a class="paper-button wardrobe-link" href="wardrobe.html">
          <strong>꿈뜰이 옷장</strong>
          <span>꿈뜰이 꾸미기</span>
        </a>
      </nav>

      <p class="build-note">REBUILD PREVIEW · 기존 기능은 새 구조에 맞춰 순차적으로 다시 연결합니다.</p>
    </section>

    <section class="screen story-screen" data-screen="story" hidden>
      <div class="story-frame">
        <header class="minimal-hud">
          <div class="hud-date">
            <small>12월 28일</small>
            <strong id="hud-place">픽셀리 집 앞</strong>
          </div>
          <nav class="hud-tools" aria-label="게임 도구">
            <button type="button" class="object-tool bag-tool" id="bag-button" aria-label="가방" disabled>
              <span class="tool-shape">▣</span><small>가방</small>
            </button>
            <button type="button" class="object-tool diary-tool" id="diary-button" aria-label="다이어리" disabled>
              <span class="tool-shape">▤</span><small>다이어리</small>
            </button>
            <button type="button" class="object-tool menu-tool" id="story-menu-button" aria-label="메뉴">
              <span class="tool-shape">☰</span><small>메뉴</small>
            </button>
          </nav>
        </header>

        <section class="scene exterior-scene is-active" data-scene="exterior" aria-label="픽셀리 집 앞">
          <img class="scene-art" src="assets/story/chapter1/house-wide.webp?v=75" alt="눈 덮인 픽셀리 집의 아침 풍경" />
          <button type="button" class="hotspot hotspot-village" id="village-hotspot" aria-label="멀리 보이는 팀샐러드 마을을 살펴보기"></button>
          <button type="button" class="hotspot hotspot-door" id="door-hotspot" aria-label="현관문 살펴보기"></button>
          <button type="button" class="edge-arrow edge-arrow-right" id="taeppeu-arrow" aria-label="오른쪽 길 살펴보기">›</button>
          <div class="inspect-bubble" id="inspect-bubble" role="status" aria-live="polite" hidden></div>
        </section>

        <section class="scene living-room-scene" data-scene="living-room" hidden aria-label="픽셀리 집 거실">
          <div class="room-placeholder" aria-hidden="true">
            <div class="room-window-placeholder"></div>
            <div class="room-sofa-placeholder"></div>
            <div class="room-rug-placeholder"></div>
            <div class="room-boxes-placeholder"><i></i><i></i><i></i></div>
          </div>
          <div class="room-note">
            <small>CHAPTER 1</small>
            <strong>생일 준비</strong>
            <span>거실 배경과 멤버 배치는 다음 구축 단계에서 연결</span>
          </div>
        </section>

        <section class="choice-sheet" id="door-choice" hidden aria-live="polite">
          <p>집 안으로 들어갈까?</p>
          <div>
            <button type="button" id="enter-house">들어간다</button>
            <button type="button" id="keep-looking">조금 더 둘러본다</button>
          </div>
        </section>

        <section class="chapter-card" id="chapter-card" hidden aria-live="polite">
          <small>12월 28일</small>
          <strong>CHAPTER 1</strong>
          <span>생일 준비</span>
        </section>

        <section class="menu-sheet" id="story-menu" hidden>
          <header>
            <strong>메뉴</strong>
            <button type="button" id="close-story-menu" aria-label="메뉴 닫기">×</button>
          </header>
          <button type="button" id="save-progress">현재 위치 저장</button>
          <button type="button" id="return-home">메인 화면으로</button>
        </section>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" aria-live="polite"></div>
</body>
</html>
