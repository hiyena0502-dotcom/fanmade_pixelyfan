<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#68caf1" />
  <title>꿈뜰이의 우당탕탕 대환장 나들이!!</title>
  <link rel="stylesheet" href="./style.css?v=title-font-click-028" />
  <link rel="stylesheet" href="./diary.css?v=title-font-click-028" />
  <link rel="preload" href="./assets/fonts/gowun-ui-bold-v2.woff" as="font" type="font/woff" crossorigin />
</head>
<body>
  <main class="title-screen" id="title-screen">
    <div class="art-stage">
      <div class="scene">
        <img class="scene-layer layer-sky" draggable="false" src="./assets/title/layers-oct8/sky.webp" alt="" />
        <img class="scene-layer layer-clouds" draggable="false" src="./assets/title/layers-oct8/clouds.webp" alt="" />
        <img class="scene-layer layer-garden" draggable="false" src="./assets/title/layers-oct8/garden.webp" alt="" />
        <div class="scene-layer layer-house">
          <img class="scene-layer" draggable="false" src="./assets/title/layers-oct8/house.webp" alt="" />
          <span class="door-sign"><img draggable="false" src="./assets/title/door-sign-user-oct8.webp" alt="PIXELY" /></span>
        </div>
        <img class="scene-layer layer-stones" draggable="false" src="./assets/title/layers-oct8/stones.webp" alt="" />
        <div class="scene-layer layer-bush">
          <img class="scene-layer bush-art" draggable="false" src="./assets/title/layers-oct8/bush.webp" alt="" />
          <div class="bush-leaves" aria-hidden="true"></div>
        </div>
      </div>
      <section class="hero" aria-labelledby="game-title">
        <h1 id="game-title" class="sr-only">꿈뜰이의 우당탕탕 대환장 나들이!!</h1>
        <img class="scene-layer layer-subtitle" draggable="false" src="./assets/title/layers-oct8/subtitle.webp" alt="초대는 받았고, 귀가는 미정!" />
        <img class="scene-layer layer-title" draggable="false" src="./assets/title/layers-oct8/title.webp" alt="꿈뜰이의 우당탕탕 대환장 나들이!!" />
      </section>
      <div class="scene-interactions">
        <span class="title-hover" aria-hidden="true"></span>
        <button class="house-touch" type="button" aria-label="집을 톡 건드리기"></button>
        <button class="bush-touch" type="button" aria-label="덤불을 부시럭거리기"></button>
      </div>
    </div>
    <div class="leaf-breeze" aria-hidden="true"></div>
    <div class="diary-positioner"><section class="notebook" aria-label="메인 메뉴">
      <div class="journal-base"><img class="journal-art" draggable="false" src="./assets/title/journal-user-v2-oct8.webp" alt="" /></div>
      <div class="note-stickers" aria-hidden="true">
        <span class="note-sticker sticker-sprig"><img draggable="false" src="./assets/title/diary-stickers-user-v2-oct8.webp" alt="" /></span>
        <span class="note-sticker sticker-daisy"><img draggable="false" src="./assets/title/diary-stickers-user-v2-oct8.webp" alt="" /></span>
        <span class="note-sticker sticker-vine"><img draggable="false" src="./assets/title/diary-stickers-user-v2-oct8.webp" alt="" /></span>
      </div>
      <header class="journal-heading">
        <h2 class="sr-only">잠뜰TV 13주년 ANNIVERSARY</h2>
        <div class="anniversary-art"><img draggable="false" src="./assets/title/anniversary-lettering-user-oct8.webp" alt="잠뜰TV 13주년 ANNIVERSARY" /></div>
        <p class="fan-label">팬메이드 게임</p>
      </header>
      <button class="menu-item wardrobe-tag" type="button" data-action="wardrobe" aria-label="꿈뜰이 옷장"><span class="wardrobe-backing"><img draggable="false" src="./assets/title/wardrobe-label-user-oct8.webp" alt="" /></span><span class="wardrobe-content"><span>꿈뜰이 옷장</span><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13 8a3 3 0 1 1 5 2l-2 2v3L3 25h26L16 15"/></svg></span></button>
      <nav class="main-menu" aria-label="게임 메뉴">
        <button class="menu-item menu-new is-active" type="button" data-action="new" aria-current="true">
          <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path class="icon-fill" d="m11 7 14 9-14 9Z"/></svg></span><span class="menu-name">새 게임</span>
        </button>
        <button class="menu-item menu-continue" type="button" data-action="continue">
          <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 5h14v23l-7-5-7 5Z"/><path d="M12 9h8"/></svg></span><span class="menu-name">이어하기</span>
        </button>
        <button class="menu-item menu-chapter" type="button" data-action="chapter">
          <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 9Q10 4 4 7v18q6-3 12 1 6-4 12-1V7q-6-3-12 2Zm0 0v17M8 12l4 1m-4 4 4 1m8-5 4-1m-4 6 4-1"/></svg></span><span class="menu-name">챕터</span>
        </button>
        <button class="menu-item menu-settings" type="button" data-action="settings">
          <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="m13 4 6 0 1 4 4 2 4-1 3 5-3 3-1 4 2 3-5 4-3-2-4 1-2 3-6-2v-4l-3-3-4-1 1-6 4-1 2-3Z"/><circle cx="16" cy="17" r="4"/></svg></span><span class="menu-name">설정</span>
        </button>
      </nav>
    </section></div>
  </main>
  <script src="./app.js?v=title-font-click-028"></script>
</body>
</html>
