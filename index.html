<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#c99169" />
  <title>꿈뜰이의 대환장 나들이</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="title-screen" id="title-screen">
    <div class="desk" aria-hidden="true">
      <span class="desk-paper desk-paper-a"></span>
      <span class="desk-paper desk-paper-b"></span>
      <span class="desk-pencil"></span>
      <span class="desk-clip"></span>
    </div>

    <section class="journal" aria-labelledby="game-title">
      <div class="journal-shadow" aria-hidden="true"></div>
      <div class="journal-cover" aria-hidden="true"></div>

      <div class="journal-tabs" aria-hidden="true">
        <span class="tab tab-orange"></span>
        <span class="tab tab-yellow"></span>
        <span class="tab tab-green"></span>
        <span class="tab tab-blue"></span>
      </div>

      <div class="journal-pages">
        <div class="page page-left">
          <span class="page-corner page-corner-left" aria-hidden="true"></span>
          <span class="tape tape-left" aria-hidden="true"></span>

          <p class="anniversary">잠뜰TV 13주년 기념 팬게임</p>

          <div class="logo-cluster">
            <span class="logo-kicker">꿈뜰이의</span>
            <h1 id="game-title">
              <span class="logo-chaos">대환장</span>
              <span class="logo-trip">나들이</span>
            </h1>
            <span class="logo-pop" aria-hidden="true">!</span>
            <span class="logo-star star-a" aria-hidden="true">✦</span>
            <span class="logo-star star-b" aria-hidden="true">★</span>
          </div>

          <div class="subtitle-sticker">초대는 받았고, 귀가는 미정!</div>

          <div class="scribble-row" aria-hidden="true">
            <span>✎</span>
            <span class="scribble-line"></span>
            <span>✦</span>
            <span>↘</span>
          </div>

          <div class="memo-note">
            <span class="memo-pin" aria-hidden="true"></span>
            <p>생일날 아침.</p>
            <p>픽셀리 멤버들의 집에 도착했다.</p>
            <p class="memo-last">…근데 왜 이렇게 조용하지?</p>
          </div>

          <div class="tiny-stickers" aria-hidden="true">
            <span class="tiny-sticker tiny-yellow">12.28</span>
            <span class="tiny-sticker tiny-green">BIRTHDAY</span>
            <span class="tiny-sticker tiny-coral">GO!</span>
          </div>
        </div>

        <div class="binding" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="page page-right">
          <span class="page-corner page-corner-right" aria-hidden="true"></span>
          <span class="tape tape-photo" aria-hidden="true"></span>

          <div class="photo-card" aria-hidden="true">
            <div class="photo-scene">
              <div class="photo-sky"></div>
              <img class="photo-lawn" src="./assets/title/lawn.png" alt="" />
              <img class="photo-house" src="./assets/title/house.png" alt="" />
            </div>
            <div class="photo-caption">
              <span>PIXELY HOUSE</span>
              <span class="photo-heart">♡</span>
            </div>
          </div>

          <div class="menu-area">
            <div class="menu-title-sticker">MENU</div>

            <nav class="main-menu" aria-label="메인 메뉴">
              <button class="menu-item menu-new is-active" type="button" data-placeholder="새 게임">
                <span class="menu-dot"></span>
                <span class="menu-label">새 게임</span>
                <span class="menu-arrow">→</span>
              </button>
              <button class="menu-item menu-continue" type="button" data-placeholder="이어하기">
                <span class="menu-dot"></span>
                <span class="menu-label">이어하기</span>
                <span class="menu-arrow">→</span>
              </button>
              <button class="menu-item menu-settings" type="button" data-placeholder="설정">
                <span class="menu-dot"></span>
                <span class="menu-label">설정</span>
                <span class="menu-arrow">→</span>
              </button>
              <button class="menu-item menu-credits" type="button" data-placeholder="크레딧">
                <span class="menu-dot"></span>
                <span class="menu-label">크레딧</span>
                <span class="menu-arrow">→</span>
              </button>
            </nav>

            <p class="menu-note" id="menu-note" aria-live="polite">
              메뉴를 골라 주세요.
            </p>
          </div>

          <div class="right-page-doodles" aria-hidden="true">
            <span class="doodle-arrow">↝</span>
            <span class="doodle-note">?</span>
            <span class="doodle-spark">✦</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
