<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#edf0d0" />
  <title>꿈뜰이의 우당탕탕 대환장 나들이!!</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="title-screen" id="title-screen">
    <div class="scene" aria-hidden="true">
      <img class="scene-layer scene-bg" src="./assets/title/scene-bg.png" alt="" />
      <img class="scene-layer scene-landscape" src="./assets/title/scene-landscape.png" alt="" />
      <img class="scene-layer scene-fence" src="./assets/title/scene-fence.png" alt="" />
      <img class="scene-layer scene-lawn" src="./assets/title/scene-lawn.png" alt="" />
      <img class="scene-house" src="./assets/title/scene-house.png" alt="" />
      <img class="scene-bushes" src="./assets/title/scene-bushes.png" alt="" />
    </div>

    <section class="hero" aria-labelledby="game-title">
      <p class="fan-label">잠뜰TV 13주년 기념 팬게임</p>
      <img
        id="game-title"
        class="main-title"
        src="./assets/title/main-title.webp"
        alt="꿈뜰이의 우당탕탕 대환장 나들이!!"
      />
      <p class="subtitle">초대는 받았고, 귀가는 미정!</p>
    </section>

    <section class="notebook" aria-label="메인 메뉴">
      <div class="notebook-page">
        <div class="ring-stack" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>

        <div class="menu-sheet">
          <header class="menu-head">
            <span class="menu-stamp">MENU</span>
            <div>
              <h2>오늘은 어디부터?</h2>
              <p>원하는 메뉴를 골라 주세요.</p>
            </div>
          </header>

          <nav class="main-menu">
            <button class="menu-item menu-new is-active" type="button" data-action="new">
              <span class="menu-icon">✦</span>
              <span class="menu-copy">
                <strong>새 게임</strong>
                <small>처음부터 시작하기</small>
              </span>
              <span class="menu-arrow">→</span>
            </button>

            <button class="menu-item menu-continue" type="button" data-action="continue">
              <span class="menu-icon">▶</span>
              <span class="menu-copy">
                <strong>이어하기</strong>
                <small>마지막 기록에서 계속</small>
              </span>
              <span class="menu-arrow">→</span>
            </button>

            <button class="menu-item menu-chapter" type="button" data-action="chapter">
              <span class="menu-icon">▣</span>
              <span class="menu-copy">
                <strong>챕터</strong>
                <small>열린 챕터 확인하기</small>
              </span>
              <span class="menu-arrow">→</span>
            </button>

            <button class="menu-item menu-wardrobe" type="button" data-action="wardrobe">
              <span class="menu-icon">♡</span>
              <span class="menu-copy">
                <strong>꿈뜰이 옷장</strong>
                <small>꿈뜰이 꾸미기</small>
              </span>
              <span class="menu-arrow">→</span>
            </button>

            <button class="menu-item menu-settings" type="button" data-action="settings">
              <span class="menu-icon">⚙</span>
              <span class="menu-copy">
                <strong>설정</strong>
                <small>화면 · 소리 · 대사 설정</small>
              </span>
              <span class="menu-arrow">→</span>
            </button>

            <button class="menu-item menu-soon" type="button" data-action="soon" disabled>
              <span class="menu-icon">…</span>
              <span class="menu-copy">
                <strong>추가 예정</strong>
                <small>새 기능을 준비 중이에요</small>
              </span>
              <span class="soon-badge">COMING SOON</span>
            </button>
          </nav>

          <button class="credits-link" type="button" data-action="credits">크레딧</button>
          <p class="menu-note" id="menu-note" aria-live="polite"></p>
        </div>

        <img class="notebook-grass" src="./assets/title/scene-grass.png" alt="" aria-hidden="true" />
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
