<!doctype html><html lang="ko"><meta charset="utf-8"><title>메뉴 첫 표시 검증</title><style>body{margin:0;background:#eee9df;font:15px sans-serif}header{padding:10px;display:flex;gap:10px}button{padding:8px}#view{position:relative;width:1100px;height:550px;margin:10px;overflow:hidden}iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform:scale(.509259);transform-origin:0 0}</style><header><button id="run">모든 메뉴 검증</button><output id="result">준비</output></header><div id="view"><iframe id="frame" title="메뉴 화면"></iframe></div><script src="./wardrobe-model.js"></script><script src="./wardrobe-store.js"></script><script>
const frame=document.querySelector('#frame'),result=document.querySelector('#result'),sleep=ms=>new Promise(ok=>setTimeout(ok,ms));async function until(f){for(let i=0;i<400;i++){if(f())return;await sleep(30)}throw Error('화면 준비 시간 초과')}
async function seed(){const s=WardrobeModel.defaults(),db=await WardrobeStore.open(),c=document.createElement('canvas');c.width=100;c.height=120;const x=c.getContext('2d');x.fillStyle='#a4b6a1';x.fillRect(15,10,70,100);const blob=await new Promise(ok=>c.toBlob(ok,'image/png'));s.parts=[{id:'qa-top',type:'clothes',subtype:'상의',name:'검증용 나들이 상의',scale:100,x:0,y:0,rotate:0,visible:true}];await WardrobeStore.writeWorkspace(db,s,[['base',blob],['part-qa-top',blob]]);const snapshot=WardrobeModel.makeSnapshot(s,new Map([['base',blob],['part-qa-top',blob]]),'검증용 저장 모습',c.toDataURL());await WardrobeStore.writeSlot(db,0,snapshot);db.close()}
document.querySelector('#run').onclick=async()=>{let n=0;const a=(name,ok)=>{if(!ok)throw Error(name);result.textContent=++n+' · '+name};try{await seed();for(const page of ['chapters','collection','wardrobe']){frame.src='qa-loading-'+page+'.html';const count=page==='chapters'?4:page==='collection'?6:5,selector=page==='wardrobe'?'.save-slot':'#record-grid>button';await until(()=>frame.contentDocument?.querySelectorAll(selector).length===count&&frame.contentDocument.querySelector('link[href*=stage.css]')?.sheet);const d=frame.contentDocument,win=frame.contentWindow;a(page+' 처음부터 카드 표시',d.querySelectorAll(selector).length===count);if(page==='wardrobe')a('이미지 분석 중 옷장 조작 잠금',d.querySelector('.cabinet').inert);else a('콘텐츠 확인 중 책 조작 잠금',d.querySelector('#record-grid').inert);for(let i=0;i<12;i++){a(page+' 대기 중 카드가 보임',[...d.querySelectorAll(selector)].every(e=>{const r=e.getBoundingClientRect(),c=win.getComputedStyle(e);return r.width>20&&r.height>20&&c.visibility==='visible'&&Number(c.opacity)===1}));if(page!=='wardrobe')a('상세 페이지도 비지 않음',!!d.querySelector('#record-detail .detail-photo'));await sleep(60)}if(page==='wardrobe'){a('이미지 분석 전에 슬롯 이름 표시',d.querySelector('.slot-name').value==='검증용 저장 모습');a('이미지 분석 전에 파츠 목록 표시',!!d.querySelector('.part-card'));await until(()=>d.querySelector('.cabinet').getAttribute('aria-busy')==='false');a('미리보기·저장 준비 완료',d.querySelectorAll('.stage-layer').length===2&&!d.querySelector('#export-character').disabled);d.querySelector('#tab-register').click();a('기존 등록 탭 동작',!d.querySelector('#panel-register').hidden);d.querySelector('#tab-parts').click();a('이름·썸네일 유지',!!d.querySelector('.part-name')&&d.querySelector('.part-thumb').width===d.querySelector('.part-thumb').height)}else{await until(()=>win.PixelyBooks);await win.PixelyBooks.ready;a('책 준비 완료',d.querySelector('#record-grid').getAttribute('aria-busy')==='false'&&!d.querySelector('#record-grid').inert);const first=d.querySelector(selector);first.click();a('책 카드 선택',first.getAttribute('aria-pressed')==='true'||d.querySelector('[data-record-id="'+first.dataset.recordId+'"]').getAttribute('aria-pressed')==='true');a('잠긴 기록 이미지 숨김',[...d.querySelectorAll('.is-locked .image-area')].every(e=>!e.querySelector('img')));a('페이지 탐색 초기 경계',d.querySelector('#page-prev').disabled)}}result.textContent=n+' checks passed · slow content / slow image decoding';}catch(e){result.textContent='FAIL after '+n+': '+e.message}};
</script></html>
