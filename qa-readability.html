<!doctype html><html lang="ko"><meta charset="utf-8"><title>홈·메뉴 크기 검증</title><style>body{margin:0;background:#eee;font:16px sans-serif}header{padding:10px;display:flex;gap:10px;align-items:center}#view{position:relative;margin:0 10px;width:1050px;height:450px;background:#4A3529;overflow:hidden}iframe{position:absolute;left:0;top:0;border:0;transform-origin:top left}output{white-space:pre-wrap}</style><header><button id="run">홈·메뉴 검증</button><button id="proof">21:9 메인 화면</button><button id="wardrobe">21:9 옷장</button><button id="settings">21:9 설정</button><button id="standard">16:9 홈</button><output id="result">준비</output></header><div id="view"><iframe id="frame" title="실제 PC 표시 영역" src="./index.html" style="width:2520px;height:1080px;transform:scale(.4166666667)"></iframe></div><script>
const frame=document.getElementById('frame'),result=document.getElementById('result'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function open(page,w,h){frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+Math.min(1050/w,450/h)+')';await new Promise((ok,no)=>{frame.onload=ok;frame.src='./'+page;setTimeout(()=>no(Error('load '+page)),15000);});await sleep(180);return [frame.contentDocument,frame.contentWindow];}
document.getElementById('proof').onclick=()=>open('index.html',2520,1080);
document.getElementById('standard').onclick=()=>open('index.html',1920,1080);
document.getElementById('wardrobe').onclick=()=>open('wardrobe.html',2520,1080);
document.getElementById('settings').onclick=async()=>{const [d]=await open('index.html',2520,1080);d.querySelector('[data-action=settings]').click();};
document.getElementById('run').onclick=async()=>{let count=0;const assert=(label,v)=>{if(!v)throw Error(label);count++;result.textContent=count+' checks · '+label;},within=(r,b)=>r.left>=b.left-1&&r.top>=b.top-1&&r.right<=b.right+1&&r.bottom<=b.bottom+1;
try{for(const [w,h]of [[3440,1440],[2520,1080],[1920,1080],[1920,1200],[1600,1200],[800,600]])for(const page of ['index.html','wardrobe.html','chapters.html','collection.html','game.html?mode=new']){
const [d,win]=await open(page,w,h);await win.PixelyAdmin.ready;await win.PixelyBooks?.ready;await win.PixelyGame?.ready;for(let i=0;i<140&&d.querySelector('.cabinet')?.getAttribute('aria-busy')==='true';i++)await sleep(50);
const viewport={left:0,top:0,right:w,bottom:h},body=d.body.getBoundingClientRect(),stage=win.PixelyStage,ui=stage.uiFit(stage.frame),physicalUI=stage.frame.scale*ui.zoom;
assert(page+' body fits',within(body,viewport));assert(page+' 3000 menu coordinates',stage.frame.width===3000&&stage.frame.height===1440&&Math.abs(body.width/body.height-25/12)<.001);for(let i=0;i<160&&[...d.querySelectorAll('img[src]')].some(e=>!e.complete);i++)await sleep(50);assert(page+' original images available',[...d.querySelectorAll('img[src]')].every(e=>e.complete&&e.naturalWidth>0));
if(page==='index.html'){
 assert('home has symmetric menu margins',Math.abs(body.width-body.height*25/12)<.1&&Math.abs(body.left-(w-body.width)/2)<.1&&Math.abs(body.top-(h-body.height)/2)<.1);
 const art=d.querySelector('.art-stage').getBoundingClientRect();assert('home covers screen without stretching',art.width>=body.width-.1&&art.height>=body.height-.1&&Math.abs(art.width/art.height-2048/983)<.001);
 for(const s of ['.hero','.notebook','.main-menu','.wardrobe-tag'])assert('home safe '+s,within(d.querySelector(s).getBoundingClientRect(),viewport));
 const t=d.querySelector('.house-touch'),r=t.getBoundingClientRect(),x=Math.max(1,Math.min(w-1,r.left+r.width*.5)),y=Math.max(1,Math.min(h-1,r.top+r.height*.5));assert('house hit target aligned',d.elementFromPoint(x,y)?.closest('.house-touch')===t);t.click();assert('house animation preserved',d.querySelector('.layer-house').getAnimations().length>0);
 d.querySelector('[data-action=settings]').click();const dialog=d.querySelector('.settings-dialog');assert('home settings opens and fits',dialog.open&&within(dialog.getBoundingClientRect(),viewport));assert('home settings readable',parseFloat(win.getComputedStyle(dialog).fontSize)*stage.frame.scale*ui.zoom>=12);
 d.querySelector('[data-developer-login]').click();for(let i=0;i<140&&!d.querySelector('.developer-login')?.open;i++)await sleep(50);assert('developer access preserved',d.querySelector('.developer-login')?.open&&within(d.querySelector('.developer-login').getBoundingClientRect(),viewport));
}else if(page==='wardrobe.html'){
 const c=d.querySelector('.cabinet');assert('wardrobe fits',within(c.getBoundingClientRect(),viewport));assert('wardrobe larger than previous scaled UI',w!==2520||c.getBoundingClientRect().width>1700);
 for(const s of ['.mirror-frame','.save-slots','.back'])assert('wardrobe control fits '+s,within(d.querySelector(s).getBoundingClientRect(),viewport));assert('wardrobe has top and bottom breathing room',c.getBoundingClientRect().top-body.top>=body.height*.05&&body.bottom-c.getBoundingClientRect().bottom>=body.height*.05);assert('wardrobe slots compact',d.querySelector('.save-slot').clientHeight<100);assert('five wardrobe slots preserved',d.querySelectorAll('.save-slot').length===5);assert('wardrobe text readable',w<1600||18*physicalUI>=16);
}else if(page.startsWith('game')){
 assert('slot screen uses menu coordinates',stage.frame.width===3000&&stage.frame.height===1440);const g=d.querySelector('.game-shell');assert('slot screen keeps 25:12 ratio',Math.abs(g.clientWidth/g.clientHeight-25/12)<.01);for(const selector of ['.return-link','.slot-book','#slot-start'])assert('slot control fits '+selector,within(d.querySelector(selector).getBoundingClientRect(),viewport));assert('game slots preserved',d.querySelectorAll('#slot-list>button').length===5);
}else {for(const s of ['.book-shell','.back-link',...(page==='collection.html'?['.collection-tabs']:[])])assert('book fits '+s,within(d.querySelector(s).getBoundingClientRect(),viewport));assert('book text readable',w<1600||18*physicalUI>=16);}
frame.style.width='1100px';frame.style.height='750px';for(let i=0;i<160&&(d.documentElement.clientWidth!==1100||d.documentElement.clientHeight!==750||!within(d.body.getBoundingClientRect(),{left:0,top:0,right:1100,bottom:750}));i++)await sleep(40);assert(page+' resize fits',within(d.body.getBoundingClientRect(),{left:0,top:0,right:1100,bottom:750}));
}
result.textContent=count+' readability checks passed';await open('index.html',2520,1080);
}catch(e){result.textContent='FAIL after '+count+': '+e.message;}};
</script></html>
