<!doctype html><html lang="ko"><meta charset="utf-8"><title>저장 기능 없는 챕터 타이틀 검증</title><link rel="stylesheet" href="./game.css?v=instant-slots-22"><link rel="stylesheet" href="./chapter-title.css?v=circular-wings-24"><style>body{display:block;padding:10px;background:#eae5dc;overflow:auto}.game-shell{width:1100px;height:619px;margin:10px 0}#qa-controls{height:54px;background:transparent;overflow:visible;display:flex;gap:10px;align-items:center}#qa-controls button{white-space:nowrap}.play-screen{width:1920px;height:1080px;transform:scale(.5729167);transform-origin:0 0}output{font:14px sans-serif;overflow-wrap:anywhere;max-width:650px}.play-tools{font:24px serif}</style><body class="motions-off"><header class="game-shell" id="qa-controls"><button id="play">전체 연출 검증</button><button id="still">완성 장식 보기</button><output id="result">저장·계정·게임 진행 기능 없는 독립 검증 화면</output></header><main class="game-shell"><section class="play-screen" id="screen"><div class="scene-background" id="scene-background"><img class="game-layer sky" src="./assets/title/layers-oct8/sky.webp" alt=""><img class="game-layer clouds" src="./assets/title/layers-oct8/clouds.webp" alt=""><img class="game-layer garden" src="./assets/title/layers-oct8/garden.webp" alt=""><img class="game-layer house" src="./assets/title/layers-oct8/house.webp" alt=""><img class="game-layer stones" src="./assets/title/layers-oct8/stones.webp" alt=""><img class="game-layer bush" src="./assets/title/layers-oct8/bush.webp" alt=""></div><nav class="play-tools">UI 검증용</nav></section></main><script src="./chapter-title.js?v=circular-wings-24"></script><script>
// This standalone page has no storage APIs and never starts a game.
const screen=document.querySelector('#screen'),result=document.querySelector('#result'),C=PixelyChapterTitle,title=C.create(screen);let running=false,start=0,checks={};
function inspect(elapsed){const root=title.element;if(!root)return;const orbit=root.querySelector('.ct-orbits');if(elapsed>500&&elapsed<1000)checks.rotation||=Math.abs(new DOMMatrix(getComputedStyle(orbit).transform).b)>.02;if(elapsed>=1550){checks.expanded=getComputedStyle(orbit).transform==='matrix(1, 0, 0, 1, 0, 0)';checks.settled=getComputedStyle(root.querySelector('.ct-title')).opacity==='1';const l=root.querySelector('.ct-wing-left').getBoundingClientRect(),r=root.querySelector('.ct-wing-right').getBoundingClientRect(),box=root.getBoundingClientRect();checks.symmetric=Math.abs(l.width-r.width)<1&&Math.abs((l.left-box.left)+(r.right-box.left)-box.width)<1;checks.contained=l.left>=box.left&&r.right<=box.right&&l.top>=box.top&&l.bottom<=box.bottom;checks.feathers=root.querySelectorAll('.ct-leaf').length===26;checks.circles=root.querySelectorAll('circle').length>=60;checks.text=root.querySelector('.ct-label').textContent==='PROLOGUE 0'&&root.querySelector('.ct-title').textContent==='초대';}if(elapsed>1850)checks.glitter||=Number(getComputedStyle(root.querySelector('.ct-sweep')).opacity)>.3;checks.uiHidden=getComputedStyle(screen.querySelector('.play-tools')).visibility==='hidden';checks.background=getComputedStyle(screen.querySelector('.scene-background')).visibility==='visible';checks.motionOff=document.body.classList.contains('motions-off');}
document.querySelector('#play').onclick=()=>{running=false;title.mount({number:0,title:'초대'},{motion:false});checks={motionAnimations:['.ct-orbits','.ct-wing-left','.ct-wing-right'].every(selector=>title.element.querySelector(selector).getAnimations().some(a=>a.effect.getKeyframes().some(f=>f.transform?.startsWith('rotate'))))};start=performance.now();running=true;result.textContent='동작 끄기 상태에서 전체 연출 검증 중';};
document.querySelector('#still').onclick=()=>{running=false;title.mount({number:0,title:'초대'},{motion:false});title.seek(2250);result.textContent='완성 장식 · 원형과 잎 날개 · 2250ms';};
function tick(now){if(running){const elapsed=Math.min(C.duration,now-start);title.seek(elapsed);inspect(elapsed);if(elapsed>=C.duration){running=false;title.hide();checks.cleanup=!document.querySelector('.chapter-title')&&!screen.classList.contains('has-chapter-title')&&getComputedStyle(screen.querySelector('.play-tools')).visibility==='visible';result.textContent=(Object.values(checks).every(Boolean)?Object.keys(checks).length+' checks passed':'FAIL')+' · '+JSON.stringify(checks);}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
