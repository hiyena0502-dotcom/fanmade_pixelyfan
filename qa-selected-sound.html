<!doctype html><html lang="ko"><meta charset="utf-8"><title>선택한 챕터 효과음 검증</title><style>body{margin:0;background:#eae5dc;font:15px sans-serif}header{padding:10px;display:flex;gap:10px}button{padding:8px}#view{position:relative;width:1100px;height:619px;margin:10px;overflow:hidden}iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform:scale(.5729167);transform-origin:0 0}</style><header><button id="normal">일반 재생</button><button id="muted">음량 0</button><button id="off">효과음 끄기</button><output id="result">준비</output></header><div id="view"><iframe id="frame" title="실제 프롤로그"></iframe></div><script>
const frame=document.querySelector('#frame'),result=document.querySelector('#result');let mode='normal',heard=[],decoded=[],seen=false,settled=false,uiHidden=true,background=true,checks=0;const hash='c940aae90a012eab46188e9469b5975215660b377c190c70b97f1d446a287e61';
function prepare(next){mode=next;heard=[];decoded=[];seen=false;settled=false;uiHidden=true;background=true;localStorage.setItem('pixely-settings-v1',JSON.stringify({masterVolume:next==='muted'?0:80,effectsVolume:75,effectsEnabled:next!=='off',motion:true}));frame.src='qa-selected-sound-game.html?mode=new';result.textContent=next+' · 빈 슬롯 선택 후 새 나들이 시작';}
document.querySelector('#normal').onclick=()=>prepare('normal');document.querySelector('#muted').onclick=()=>prepare('muted');document.querySelector('#off').onclick=()=>prepare('off');
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data.type==='qa-start')heard.push(e.data);if(e.data.type==='qa-decode')decoded.push(e.data)});
function monitor(){const d=frame.contentDocument,win=frame.contentWindow,root=d?.querySelector('.chapter-title');if(root){seen=true;const elapsed=Number(root.dataset.elapsed);if(elapsed>=1400&&elapsed<1800)settled=win.getComputedStyle(root.querySelector('.ct-title')).opacity==='1';uiHidden&&=win.getComputedStyle(d.querySelector('.play-tools')).visibility==='hidden';background&&=win.getComputedStyle(d.querySelector('.scene-background')).visibility==='visible';}else if(seen){seen=false;try{const a=(name,ok)=>{if(!ok)throw Error(name);checks++};a('원본 파일 그대로 디코드',decoded.some(v=>v.hash===hash&&Math.abs(v.duration-3.68)<.00001&&v.rate===48000));a('제목과 두 번째 타격 정렬',settled);a('실제 배경 표시와 UI 숨김',uiHidden&&background);if(mode==='normal'){a('새 파일을 한 번만 재생',heard.length===1);a('첫 타격 프레임',heard[0].elapsed>=1120&&heard[0].elapsed<=1170);a('기존 효과음 음량 적용',Math.abs(heard[0].gain-.6)<.0001);a('전체 파일 재생',Math.abs(heard[0].duration-3.68)<.00001&&heard[0].rate===48000)}else a('음소거 유지',heard.length===0);a('4.8초 뒤 정상 플레이',!d.querySelector('#play-screen').hidden&&!d.documentElement.classList.contains('chapter-title-active'));result.textContent=checks+' checks passed · '+mode+' · '+JSON.stringify({heard,decoded,settled})}catch(e){result.textContent='FAIL: '+e.message}}requestAnimationFrame(monitor)}requestAnimationFrame(monitor);
</script></html>
