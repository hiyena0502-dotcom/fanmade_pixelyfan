<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#777}iframe{width:1920px;height:911px;border:0;display:block}nav{display:flex;gap:10px;padding:10px;background:#fff4df}button{font-size:18px}</style></head><body><iframe id="frame" src="./game.html?mode=new"></iframe><nav><button data-src="game.html?mode=new">새 게임</button><button data-src="game.html?mode=continue">이어하기</button><button data-src="chapters.html">챕터</button><button data-src="collection.html">콜렉션</button><button data-src="index.html">메인</button><button id="tests">테스트 흐름 검증</button><output id="results"></output></nav><script>document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>frame.src='./'+b.dataset.src);document.getElementById('tests').onclick=async()=>{const out=document.getElementById('results'),w=frame.contentWindow,d=w.document,G=w.PixelyGame,M=w.PixelyGameModel,results=[];const assert=(label,pass)=>{results.push({label,pass});if(!pass)throw Error(label);},sleep=ms=>new Promise(r=>setTimeout(r,ms));async function finish(){for(let i=0;i<50&&G.getState().run;i++){const s=M.current(G.getState());if(s.type==='choice'||s.type==='puzzle')return;d.getElementById('dialogue-next').click();await sleep(120);}assert('event settles',!G.getState().run);}try{await G.ready;const slots=await w.PixelyGameStore.slots();if(slots.manual.size||slots.auto.size)throw Error('Use empty QA browser slots');d.querySelector('#slot-list>button').click();d.getElementById('slot-start').click();await sleep(400);assert('opening starts',G.getState().run.id==='opening');const count=G.getState().run.presentation.count;d.getElementById('open-menu').click();await sleep(120);assert('menu pauses dialogue',Math.abs(G.getState().run.presentation.count-count)<1);d.getElementById('panel-close').click();await finish();assert('no always-visible player',d.querySelectorAll('[data-actor=player]').length===0);d.querySelector('[data-object=invitation]').click();await finish();assert('invitation registered',G.getState().collections['item-1']);d.querySelector('[data-object=bush]').click();await finish();assert('key acquired',G.getState().inventory['test-key']===1);d.querySelector('[data-object=bush]').click();assert('repeat event',G.getState().run.id==='bush-again');await finish();d.querySelector('[data-object=door]').click();await finish();assert('choice visible',!d.getElementById('choices').hidden);d.querySelector('#choices>button').click();await finish();assert('door unlocked',G.getState().flags['door-open']);d.querySelector('.exit-arrow.right').click();await sleep(500);assert('hall reached',G.getState().location==='hall');d.getElementById('open-bag').click();d.querySelector('#panel-content button:nth-child(2)').click();assert('key selected',G.getState().selectedItem==='test-key');d.querySelector('[data-object=box]').click();await finish();assert('key consumed, record retained',G.getState().inventory['test-key']===0&&G.getState().collections['item-2']);d.querySelector('[data-object=puzzle]').click();d.querySelector('.puzzle-input input').value='13';d.querySelector('.puzzle-input').requestSubmit();await sleep(100);await finish();assert('puzzle completed',G.getState().puzzles['number-note']);await sleep(350);const record=(await w.PixelyGameStore.slots()).auto.get(0);assert('autosave exact location and puzzle',record.state.location==='hall'&&record.state.puzzles['number-note']);const restored=M.restore(record.state,G.getData());assert('restored inventory and choices',restored.inventory.flower===1&&restored.choices['door-choice']===0);const rect=d.getElementById('game-shell').getBoundingClientRect();assert('16:9',Math.abs(rect.width/rect.height-16/9)<.002);out.textContent=results.length+' checks passed';}catch(e){out.textContent='FAIL '+e.message;}window.QAResults=results;};</script></body></html>
