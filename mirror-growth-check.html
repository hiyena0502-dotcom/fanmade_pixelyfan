<!doctype html><meta charset="utf-8"><title>Wardrobe integration checks</title>
<style>body{font:16px system-ui;padding:20px;background:#eee8db}button{padding:12px}iframe{width:100%;height:720px;border:0}li{margin:6px}#result{font-weight:bold}</style>
<h1>옷장 통합 검사</h1><p>이 검사용 배포에서만 단색 도형으로 이미지 등록, 슬롯 복원, PNG 출력을 검사합니다.</p>
<button id="start">검사 실행</button><p id="result">대기 중</p><ol id="checks"></ol><iframe id="frame" src="./wardrobe.html"></iframe>
<script>
const frame=document.getElementById('frame'),checks=document.getElementById('checks'),result=document.getElementById('result');
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn,msg){for(let i=0;i<100;i++){if(fn())return;await pause(40);}throw new Error(msg||'timeout');}
let w,d;
const $=id=>d.getElementById(id);
async function ready(){await until(()=>frame.contentWindow.WardrobeStore&&frame.contentDocument.getElementById('cabinet').getAttribute('aria-busy')==='false','app not ready');w=frame.contentWindow;d=frame.contentDocument;}
async function settled(){await until(()=>!$('cabinet').inert,'action remained busy');await pause(250);}
function assert(condition,label){if(!condition)throw new Error(label);const li=document.createElement('li');li.textContent='PASS · '+label;checks.append(li);}
async function click(id){$(id).click();await settled();}
function number(key,value){const e=d.querySelector('[data-number="'+key+'"]');e.value=value;e.dispatchEvent(new w.Event('input',{bubbles:true}));}
async function files(id,file){const transfer=new w.DataTransfer();transfer.items.add(file);$(id).files=transfer.files;$(id).dispatchEvent(new w.Event('change',{bubbles:true}));await settled();}
async function fixture(name,color){const canvas=d.createElement('canvas');canvas.width=1000;canvas.height=1200;const ctx=canvas.getContext('2d');ctx.fillStyle=color;ctx.fillRect(380,400,240,400);return new w.File([await new Promise(r=>canvas.toBlob(r,'image/png'))],name,{type:'image/png'});}
async function workspace(){const db=await w.WardrobeStore.open();try{return await w.WardrobeStore.readWorkspace(db);}finally{db.close();}}
async function slots(){const db=await w.WardrobeStore.open();try{return await w.WardrobeStore.readSlots(db);}finally{db.close();}}
async function reload(){frame.src='./wardrobe.html?check='+Date.now();await pause(100);await ready();}
async function confirmAction(id,value){$(id).click();await until(()=>$('confirm-dialog').open,'confirmation not visible');$('confirm-dialog').close(value);await settled();}
document.getElementById('start').onclick=async()=>{
 document.getElementById('start').disabled=true;
 try{
  await ready();assert((await workspace()).images.size===0,'Disposable QA wardrobe starts empty');
  const base=await fixture('qa-base.png','#a96743'),part=await fixture('qa-part.png','#638fc2');
  await click('tab-register');await files('base-file',base);
  assert($('stage-layers').children.length===1&&!$('export-character').disabled,'Base upload decodes and renders through actual input handler');
  const heights=[];
  for(const scale of [136,244,300,600]){
    number('scale',scale);await pause(100);
    const image=$('stage-layers').querySelector('img'),rect=image.getBoundingClientRect(),stage=$('preview-stage').getBoundingClientRect();
    const painted={left:rect.left+rect.width*.38,right:rect.left+rect.width*.62,top:rect.top+rect.height/3,bottom:rect.top+rect.height*2/3};
    heights.push(painted.bottom-painted.top);
    assert(painted.left>=stage.left&&painted.right<=stage.right&&painted.top>=stage.top&&painted.bottom<=stage.bottom,'Painted PNG fully visible at '+scale+'%');
  }
  assert(heights[1]>heights[0]*1.7&&heights[2]>heights[1]*1.2&&heights[3]>heights[2]*1.2,'Transparent-margin artwork really grows at 244, 300 and 600 percent');
  number('scale',100);await pause(200);
  await click('tab-register');$('new-name').value='검사 상의';await files('new-file',part);await click('add-part');
  assert($('stage-layers').children.length===2,'Part registration applies above base');
  let ws=await workspace();const id=ws.state.parts[0].id;
  await click('tab-adjust');number('x',65);number('y',-25);number('scale',120);number('rotate',9);await pause(350);
  ws=await workspace();assert(ws.state.parts[0].x===65&&ws.state.parts[0].scale===120&&ws.state.parts[0].rotate===9&&ws.state.base.scale===100,'Precise transforms persist on selected part only');
  await click('tab-parts');const checkbox=d.querySelector('.part-card input');checkbox.checked=false;checkbox.dispatchEvent(new w.Event('change',{bubbles:true}));await settled();
  assert($('stage-layers').children.length===1,'Part checkbox hides only chosen part');
  const back=d.querySelector('.part-card input');back.checked=true;back.dispatchEvent(new w.Event('change',{bubbles:true}));await settled();
  for(let i=0;i<5;i++){
   await click('tab-adjust');number('x',i*35);await pause(200);
   const card=d.querySelectorAll('.save-slot')[i];card.querySelector('input').value='QA 모습 '+(i+1);card.querySelector('[aria-label="슬롯 '+(i+1)+'에 저장"]').click();await settled();
  }
  const saved=await slots();assert(saved.size===5&&[...saved.values()].every(s=>s.images.length===2&&s.thumbnail.startsWith('data:image/webp')),'All five slots save image bytes, thumbnail and layer state');
  assert([...saved.values()].map(s=>s.state.parts[0].x).join(',')==='0,35,70,105,140','Slots keep five independent appearances');
  const oldBytes=await saved.get(0).images.find(([key])=>key==='base')[1].arrayBuffer();
  await click('tab-register');await files('base-file',await fixture('replacement.png','#dfbc57'));
  $('layer-remove').click();await until(()=>$('confirm-dialog').open);$('confirm-dialog').close('confirm');await settled();
  assert(!(await workspace()).images.has('base'),'Base removal removes current asset');
  await click('tab-adjust');$('layer-select').value=id;$('layer-select').dispatchEvent(new w.Event('change',{bubbles:true}));await confirmAction('layer-remove','confirm');
  assert((await workspace()).state.parts.length===0,'Current part removal leaves saved looks intact');
  d.querySelector('[aria-label="슬롯 1 불러오기"]').click();await settled();ws=await workspace();
  assert(ws.images.size===2&&ws.state.parts[0].id===id&&ws.state.parts[0].x===0,'Slot load restores deleted part and original placement');
  assert(new Uint8Array(await ws.images.get('base').arrayBuffer()).join(',')===new Uint8Array(oldBytes).join(','),'Slot load restores original base bytes after replacement/removal');
  await click('tab-register');$('new-name').value='나중에 추가한 소품';$('new-type').value='items';$('new-type').dispatchEvent(new w.Event('change'));await files('new-file',part);await click('add-part');
  d.querySelector('[aria-label="슬롯 2 불러오기"]').click();await settled();ws=await workspace();
  assert(ws.state.parts.length===2&&ws.state.parts[1].visible===false&&ws.state.parts[0].x===35,'Loading old look retains newly registered parts, switched off');
  d.querySelector('[data-category="clothes"]').click();const edit=d.querySelector('.part-edit');edit.click();$('new-name').value='바꾸면 안 되는 이름';await click('cancel-edit');
  assert((await workspace()).state.parts[0].name==='검사 상의','Cancelling edit preserves registered name');
  await reload();ws=await workspace();
  assert((await slots()).size===5&&ws.state.parts[0].x===35&&$('stage-layers').children.length===2,'Reload restores five slots and current appearance from IndexedDB');
  await click('tab-adjust');$('layer-select').value='base';$('layer-select').dispatchEvent(new w.Event('change'));
  assert([...d.querySelectorAll('[data-move]')].every(button=>button.disabled),'Base stays below every part');
  let png,filename;const originalURL=w.URL.createObjectURL.bind(w.URL),originalClick=w.HTMLAnchorElement.prototype.click;
  w.URL.createObjectURL=blob=>{if(blob.type==='image/png')png=blob;return originalURL(blob);};
  w.HTMLAnchorElement.prototype.click=function(){if(this.download)filename=this.download;else originalClick.call(this);};
  await click('export-character');
  w.URL.createObjectURL=originalURL;w.HTMLAnchorElement.prototype.click=originalClick;
  const bitmap=await w.createImageBitmap(png),output=d.createElement('canvas');output.width=bitmap.width;output.height=bitmap.height;output.getContext('2d').drawImage(bitmap,0,0);bitmap.close();
  assert(output.width===1000&&output.height===1200&&filename==='꿈뜰이-캐릭터.png','Export produces the real 1000×1200 character PNG');
  assert(output.getContext('2d').getImageData(0,0,1,1).data[3]===0&&output.getContext('2d').getImageData(500,600,1,1).data[3]===255,'PNG has transparent outside and composed image inside');
  const slot3=d.querySelector('[aria-label="슬롯 3 비우기"]');slot3.click();await until(()=>$('confirm-dialog').open);$('confirm-dialog').close('cancel');await settled();
  assert((await slots()).size===5,'Cancelling slot clear preserves every saved look');
  result.textContent='PASS · '+checks.children.length+' integration checks';result.style.color='#285d36';
 }catch(error){result.textContent='FAIL · '+error.message;result.style.color='#9b2626';console.error(error);}
};
</script>
