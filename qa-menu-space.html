<!doctype html><html lang="ko"><meta charset="utf-8"><title>메뉴 여백 검증</title><style>body{margin:0;font:15px sans-serif;background:#ece7df}header{display:flex;gap:8px;padding:10px;align-items:center}button{padding:8px}#view{width:1100px;height:550px;position:relative;margin:0 10px;background:#4a3529;overflow:hidden}iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0}output{max-width:650px}</style><header><button id="run">전체 검증</button><button id="wardrobe">21:9 옷장</button><button id="books">21:9 책</button><button id="settings">21:9 설정</button><button id="windowed">창 모드 옷장</button><output id="result">준비</output></header><div id="view"><iframe id="frame" title="실제 메뉴 화면"></iframe></div><script src="./wardrobe-model.js"></script><script src="./wardrobe-store.js"></script><script>
const frame=document.querySelector('#frame'),result=document.querySelector('#result'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn){for(let i=0;i<200;i++){if(fn())return;await sleep(40);}throw Error('초기화 대기 시간 초과');}
async function seed(){const db=await WardrobeStore.open();const existing=await WardrobeStore.readWorkspace(db);if(existing.state?.parts?.some(p=>p.id==='qa-01')){db.close();return;}const s=WardrobeModel.defaults(),c=document.createElement('canvas');c.width=1000;c.height=1200;const x=c.getContext('2d');x.fillStyle='#c1dfeb';x.fillRect(340,400,320,450);x.fillStyle='#f4ddbc';x.beginPath();x.arc(500,280,155,0,7);x.fill();const blob=await new Promise(ok=>c.toBlob(ok,'image/png')),images=[['base',blob]];for(let i=1;i<=12;i++){const id='qa-'+String(i).padStart(2,'0');s.parts.push({id,type:'clothes',subtype:'상의',name:i===1?'검증용 긴 이름의 따뜻한 나들이 옷':'검증용 나들이 옷 '+i,x:0,y:0,scale:100,rotate:0,visible:i===1});images.push([WardrobeModel.imageKey(id),blob]);}await WardrobeStore.writeWorkspace(db,s,images);db.close();}
async function open(page,w,h){frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+Math.min(1100/w,550/h)+')';await new Promise((ok,no)=>{frame.onload=ok;const u=new URL(page,location.href),share=new URLSearchParams(location.search).get('_vercel_share');if(share)u.searchParams.set('_vercel_share',share);frame.src=u.href;setTimeout(()=>no(Error('페이지 로드 실패')),20000);});const win=frame.contentWindow,d=frame.contentDocument;await until(()=>win.PixelyStage&&(page.startsWith('game.html')||d.querySelector('link[href*=menu-layout]')?.sheet?.cssRules.length));await win.PixelyAdmin?.ready;await win.PixelyBooks?.ready;await until(()=>d.querySelector('.cabinet')?.getAttribute('aria-busy')!=='true');await d.fonts.ready;return [d,win];}
async function proof(page,w=2520,h=1080){await seed();const [d]=await open(page,w,h);if(page==='index.html')d.querySelector('[data-action=settings]').click();result.textContent=w+'×'+h+' · '+page;}
document.querySelector('#wardrobe').onclick=()=>proof('wardrobe.html');document.querySelector('#books').onclick=()=>proof('collection.html');document.querySelector('#settings').onclick=()=>proof('index.html');document.querySelector('#windowed').onclick=()=>proof('wardrobe.html',1920,1080);
document.querySelector('#run').onclick=async()=>{let n=0;const a=(name,ok)=>{if(!ok)throw Error(name);n++;result.textContent=n+' · '+name;},within=(r,b)=>r.left>=b.left-1&&r.top>=b.top-1&&r.right<=b.right+1&&r.bottom<=b.bottom+1;try{await seed();for(const [w,h]of [[3440,1440],[2520,1080],[1920,1080],[1920,900],[1600,1000],[1363,936]])for(const page of ['wardrobe.html']){const [d,win]=await open(page,w,h),stage=win.PixelyStage,b=d.body.getBoundingClientRect(),ui=stage.uiFit(stage.frame),unit=stage.frame.scale*ui.zoom,viewport={left:0,top:0,right:w,bottom:h};a(page+' 메뉴 기준 좌표',stage.frame.width>=3000-.1&&stage.frame.height>=1440-.1);a('메뉴 필러박스 없음',Math.abs(b.left)<1&&Math.abs(b.top)<1&&Math.abs(b.width-w)<1&&Math.abs(b.height-h)<1);
if(page==='index.html'){const names=[...d.querySelectorAll('.menu-name')];a('균형 잡힌 메인 메뉴 글씨',names.every(e=>parseFloat(win.getComputedStyle(e).fontSize)*stage.frame.scale>=19&&parseFloat(win.getComputedStyle(e).fontSize)<=44));a('균형 잡힌 옷장 글씨',parseFloat(win.getComputedStyle(d.querySelector('.wardrobe-tag')).fontSize)*stage.frame.scale>=14&&parseFloat(win.getComputedStyle(d.querySelector('.wardrobe-tag')).fontSize)<=32);for(const name of names)a('메뉴 글씨 버튼 내부',within(name.getBoundingClientRect(),name.closest('button').getBoundingClientRect()));a('옷장 글씨 일기장 내부',within(d.querySelector('.wardrobe-content').getBoundingClientRect(),d.querySelector('.notebook').getBoundingClientRect()));const home=d.querySelector('.hero').getBoundingClientRect();d.querySelector('[data-action=settings]').click();const dialog=d.querySelector('.settings-dialog'),r=dialog.getBoundingClientRect();a('설정창 중앙',Math.abs(r.left+r.width/2-w/2)<1&&Math.abs(r.top+r.height/2-h/2)<1);a('설정창 위아래 여백',r.height<=b.height*.741&&within(r,viewport));a('본문 글씨 유지',parseFloat(win.getComputedStyle(dialog).fontSize)*unit>=16);a('닫기 버튼 클릭 크기',d.querySelector('.settings-close').getBoundingClientRect().width>=42);for(const tab of d.querySelectorAll('.settings-tabs button')){tab.click();const panel=d.querySelector('.settings-panel:not([hidden])');a('설정 탭 전환 '+tab.id,panel.getAttribute('aria-labelledby')===tab.id);a('헤더·완료 버튼 고정',within(d.querySelector('.settings-close').getBoundingClientRect(),r)&&within(d.querySelector('.settings-done').getBoundingClientRect(),r));}a('메인 일러스트 좌표 유지',JSON.stringify(home.toJSON())===JSON.stringify(d.querySelector('.hero').getBoundingClientRect().toJSON()));d.querySelector('.settings-close').click();a('닫기 동작',!dialog.open);
}else{if(page==='collection.html')d.querySelector('.collection-tabs button').click();const panel=d.querySelector(page==='wardrobe.html'?'.cabinet':'.book-shell'),r=panel.getBoundingClientRect();a('패널 중앙',Math.abs(r.left+r.width/2-b.left-b.width/2)<1&&Math.abs(r.top+r.height/2-b.top-b.height/2)<1);a('패널 좌우 여백',r.width<=b.width*(page==='wardrobe.html'?.841:.821));a('패널 위아래 여백',r.height<=b.height*(page==='wardrobe.html'?.821:.801));a('패널 경계',within(r,b));a('글씨 유지',18*unit>=16);
if(page==='wardrobe.html'){const mirror=d.querySelector('.mirror-frame').getBoundingClientRect();a('큰 거울 유지',mirror.height>=mirror.width*1.1&&mirror.height>=d.querySelector('.cabinet-content').getBoundingClientRect().height*.78&&within(mirror,r));const bay=d.querySelector('.mirror-panel').getBoundingClientRect();a('거울 미리보기 영역 안쪽 여백',mirror.left>=bay.left+8*unit-1&&mirror.right<=bay.right-20*unit+1&&within(mirror,bay));const sign=d.querySelector('.hanging-sign').getBoundingClientRect();a('간판과 줄도 틀 안에',sign.top-10*unit>=r.top+10*unit-1&&within(sign,r));a('다섯 슬롯 유지',d.querySelectorAll('.save-slot').length===5);for(const slot of d.querySelectorAll('.save-slot')){a('저장 슬롯 경계',within(slot.getBoundingClientRect(),r));for(const button of slot.querySelectorAll('button'))a('저장 버튼 경계',within(button.getBoundingClientRect(),slot.getBoundingClientRect()));}const list=d.querySelector('.parts-list');a('목록만 스크롤',list.scrollHeight>list.clientHeight&&win.getComputedStyle(list).overflowY==='auto');const cards=[...d.querySelectorAll('.part-card')];for(let i=1;i<cards.length;i++)if(cards[i].offsetTop>cards[i-1].offsetTop)a('카드 행 겹침 없음',cards[i].getBoundingClientRect().top>=cards[i-1].getBoundingClientRect().bottom);for(const thumb of d.querySelectorAll('.part-thumb')){const tr=thumb.getBoundingClientRect();a('썸네일 1:1',Math.abs(tr.width-tr.height)<1);}a('이름 표시 방식',d.querySelector('.part-name').clientHeight===48);const edit=d.querySelector('.part-edit');edit.scrollIntoView({block:'nearest'});const er=edit.getBoundingClientRect();a('클릭 영역 정렬',d.elementFromPoint(er.x+er.width/2,er.y+er.height/2)?.closest('.part-edit')===edit);edit.click();a('기존 편집 동작',!d.querySelector('#panel-register').hidden);d.querySelector('#tab-parts').click();a('목록 탭 복귀',!d.querySelector('#panel-parts').hidden);if(w===2520){const db=await win.WardrobeStore.open(),before=await win.WardrobeStore.readWorkspace(db),check=d.querySelector('.part-card input[type=checkbox]');check.click();await until(()=>d.querySelector('.part-card input[type=checkbox]').checked!==before.state.parts[0].visible);await sleep(100);const after=await win.WardrobeStore.readWorkspace(db);a('착용 상태 저장',after.state.parts[0].visible!==before.state.parts[0].visible);a('이미지 좌표 보존',after.state.parts[0].x===before.state.parts[0].x&&after.state.parts[0].scale===before.state.parts[0].scale);d.querySelector('.slot-actions button').click();await until(()=>d.querySelector('.slot-meta').textContent!=='비어 있는 슬롯');a('슬롯 저장',!!(await win.WardrobeStore.readSlots(db)).get(0));await until(()=>d.querySelector('.cabinet').getAttribute('aria-busy')!=='true');d.querySelectorAll('.slot-actions button')[1].click();await until(()=>d.querySelector('#save-status').textContent.includes('불러왔어요'));a('불러오기 동작',d.querySelector('#save-status').textContent.includes('불러왔어요'));db.close();}
}else{for(const card of d.querySelectorAll('.chapter-card,.collection-card'))for(const child of card.querySelectorAll('.image-area,strong,.card-number'))a('책 카드 내부 경계',within(child.getBoundingClientRect(),card.getBoundingClientRect()));a('책 돌아가기 경계',within(d.querySelector('.back-link').getBoundingClientRect(),b));for(const p of d.querySelectorAll('.book-page'))a('책 페이지 경계',within(p.getBoundingClientRect(),r));const card=d.querySelector('.chapter-card,.collection-card');card.click();a('카드 선택',d.querySelector('[data-record-id="'+card.dataset.recordId+'"]').getAttribute('aria-pressed')==='true');if(page==='collection.html'){a('책갈피 탭 여백',within(d.querySelector('.collection-tabs').getBoundingClientRect(),b));for(const tab of d.querySelectorAll('.collection-tabs button')){tab.click();a('도감 분류 전환',tab.getAttribute('aria-selected')==='true');}}}}
}result.textContent=n+' menu spacing checks passed';await proof('wardrobe.html');result.textContent=n+' menu spacing checks passed';}catch(e){result.textContent='FAIL after '+n+': '+e.message;}};
</script></html>
