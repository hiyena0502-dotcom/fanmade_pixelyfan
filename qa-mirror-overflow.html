<!doctype html><html lang="ko"><meta charset="utf-8"><title>거울 이미지 확대 검증</title><style>body{margin:0;font:15px sans-serif;background:#ece7df}header{display:flex;gap:8px;padding:10px;align-items:center}button{padding:8px}#view{width:1100px;height:550px;position:relative;margin:0 10px;overflow:hidden}iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0}</style><header><button id="run">전체 검증</button><button id="normal">100% 보기</button><button id="large">300% 보기</button><output id="result">준비</output></header><div id="view"><iframe id="frame" title="실제 옷장 화면"></iframe></div><script src="./wardrobe-model.js"></script><script src="./wardrobe-store.js"></script><script>
const frame=document.querySelector('#frame'),result=document.querySelector('#result'),sleep=ms=>new Promise(ok=>setTimeout(ok,ms));
async function until(f){for(let i=0;i<200;i++){if(f())return;await sleep(50);}throw Error('화면 준비 시간 초과');}
async function seed(){const db=await WardrobeStore.open(),s=WardrobeModel.defaults(),c=document.createElement('canvas');c.width=1000;c.height=1200;const x=c.getContext('2d');x.fillStyle='#f2bb86';x.beginPath();x.arc(500,230,135,0,7);x.fill();x.fillStyle='#629bb8';x.fillRect(250,390,500,430);x.fillRect(90,410,190,125);x.fillRect(720,410,190,125);x.fillStyle='#775744';x.fillRect(280,820,175,235);x.fillRect(545,820,175,235);const blob=await new Promise(ok=>c.toBlob(ok,'image/png'));await WardrobeStore.writeWorkspace(db,s,[['base',blob]]);db.close();}
async function open(w=1920,h=1080){frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+Math.min(1100/w,550/h)+')';await new Promise(ok=>{frame.onload=ok;const u=new URL('wardrobe.html',location.href),share=new URLSearchParams(location.search).get('_vercel_share');if(share)u.searchParams.set('_vercel_share',share);frame.src=u.href;});const d=frame.contentDocument,win=frame.contentWindow;await until(()=>d.querySelector('.cabinet')?.getAttribute('aria-busy')==='false'&&d.querySelector('.stage-layer')?.complete&&d.querySelector('link[href*=menu-layout]')?.sheet);await d.fonts.ready;d.querySelector('#tab-adjust').click();return [d,win];}
function adjust(d,key,value){const input=d.querySelector('[data-number="'+key+'"]');input.value=value;input.dispatchEvent(new Event('input',{bubbles:true}));}
async function proof(scale){await seed();const [d]=await open();adjust(d,'scale',scale);result.textContent=scale+'% · 실제 옷장';}
document.querySelector('#normal').onclick=()=>proof(100);document.querySelector('#large').onclick=()=>proof(300);
document.querySelector('#run').onclick=async()=>{let n=0;const a=(name,ok)=>{if(!ok)throw Error(name);result.textContent=++n+' · '+name;};try{await seed();for(const [w,h]of [[3440,1440],[2520,1080],[1920,1080],[1920,900],[1600,1000],[1363,936]]){const [d,win]=await open(w,h),root=d.querySelector('.stage-layers');adjust(d,'scale',100);const first=d.querySelector('.stage-layer').getBoundingClientRect(),transform=root.style.transform;for(const scale of [200,300,400]){adjust(d,'scale',scale);const image=d.querySelector('.stage-layer'),r=image.getBoundingClientRect(),glass=d.querySelector('.preview-stage').getBoundingClientRect();a('확대율 실제 반영 '+scale,Math.abs(r.width/first.width-scale/100)<.001);a('자동 축소·재중앙 정렬 없음',root.style.transform===transform);if(scale===300){a('이미지 거울 밖 확장',r.left<glass.left&&r.right>glass.right);for(let e=image.parentElement;e&&e!==d.body;e=e.parentElement)a('부모 요소에서 이미지 자르지 않음 '+e.className,win.getComputedStyle(e).overflowX==='visible'&&win.getComputedStyle(e).overflowY==='visible');}a('이미지가 버튼 클릭 가로채지 않음',win.getComputedStyle(root).pointerEvents==='none');}adjust(d,'x',180);adjust(d,'y',-120);adjust(d,'rotate',20);a('위치·회전에도 기본 캔버스 유지',root.style.transform===transform);d.querySelector('#tab-parts').click();a('큰 이미지 표시 중 목록 클릭',!d.querySelector('#panel-parts').hidden);d.querySelector('#tab-adjust').click();a('조정 탭 다시 클릭',!d.querySelector('#panel-adjust').hidden);await sleep(400);const db=await win.WardrobeStore.open(),workspace=await win.WardrobeStore.readWorkspace(db);a('저장된 크기·위치·회전 유지',workspace.state.base.scale===400&&workspace.state.base.x===180&&workspace.state.base.y===-120&&workspace.state.base.rotate===20);db.close();if(w===2520){d.querySelector('.slot-actions button').click();await until(()=>d.querySelector('.slot-meta').textContent!=='비어 있는 슬롯');adjust(d,'scale',100);d.querySelectorAll('.slot-actions button')[1].click();await until(()=>d.querySelector('#save-status').textContent.includes('불러왔어요'));a('슬롯 불러오기 확대율 복원',d.querySelector('[data-number=scale]').value==='400');}}await proof(300);result.textContent=n+' mirror overflow checks passed';}catch(e){result.textContent='FAIL after '+n+': '+e.message;}};
</script></html>
