<!doctype html><html lang="ko"><meta charset="utf-8"><title>거울 오른쪽 확장 검증</title><style>body{margin:0;font:15px sans-serif;background:#ece7df}header{padding:10px;display:flex;gap:10px}button{padding:8px}#view{width:1100px;height:550px;position:relative;margin:10px;overflow:hidden}iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0}</style><header><button id="run">전체 검증</button><output id="result">준비</output></header><div id="view"><iframe id="frame" title="실제 옷장"></iframe></div><script>
const frame=document.querySelector('#frame'),result=document.querySelector('#result'),sleep=ms=>new Promise(ok=>setTimeout(ok,ms));
async function open(w,h){frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+Math.min(1100/w,550/h)+')';await new Promise(ok=>{frame.onload=ok;frame.src=new URL('wardrobe.html',location.href).href});const d=frame.contentDocument;for(let i=0;i<200;i++){if(d.querySelector('.cabinet')?.getAttribute('aria-busy')==='false'&&d.querySelector('link[href*=menu-layout]')?.sheet)break;await sleep(50)}await d.fonts.ready;return d}
document.querySelector('#run').onclick=async()=>{let n=0,rows=[];const a=(label,ok)=>{if(!ok)throw Error(label);result.textContent=++n+' · '+label};try{for(const [w,h]of [[3440,1440],[2520,1080],[1920,1080],[1920,900],[1600,1000],[1363,936]]){const d=await open(w,h),win=d.defaultView,rect=s=>d.querySelector(s).getBoundingClientRect(),style=d.createElement('style');style.textContent='html[data-screen="ui"] .cabinet-content{grid-template-columns:minmax(0,.34fr) minmax(0,.66fr)}html[data-screen="ui"] .mirror-frame{width:min(100%,calc((100cqh - 36px) * .72))}';d.head.append(style);const old=rect('.mirror-frame');style.remove();const mirror=rect('.mirror-frame'),panel=rect('.cabinet-content'),controls=rect('.wardrobe-controls');a('왼쪽 경계 유지',Math.abs(old.left-mirror.left)<.15);a('세로 높이 유지',Math.abs(old.height-mirror.height)<.15);a('오른쪽으로 폭 증가',mirror.width>old.width+20);a('거울과 꾸미기 영역 분리',mirror.right<controls.left);a('거울 패널 안에 배치',mirror.left>=panel.left&&mirror.right<=panel.right&&mirror.top>=panel.top&&mirror.bottom<=panel.bottom);for(const e of d.querySelectorAll('.save-slot,.slot-actions button,.slot-name,.slot-top')){const r=e.getBoundingClientRect();a('슬롯 내용 잘리지 않음',r.left>=controls.left-.2&&r.right<=controls.right+.2&&r.bottom<=controls.bottom+.2);if(e.classList.contains('slot-top'))a('슬롯 번호 한 줄',e.scrollWidth<=e.clientWidth+1)}a('이미지 잘림 해제 유지',win.getComputedStyle(d.querySelector('.preview-stage')).overflow==='visible');d.querySelector('#tab-adjust').click();a('조정 탭 클릭',!d.querySelector('#panel-adjust').hidden);d.querySelector('#tab-parts').click();a('목록 탭 클릭',!d.querySelector('#panel-parts').hidden);rows.push({w,h,before:old.width,after:mirror.width,left:mirror.left})}await open(1920,1080);result.textContent=n+' checks passed · '+JSON.stringify(rows)}catch(e){result.textContent='FAIL after '+n+': '+e.message}};
</script></html>
