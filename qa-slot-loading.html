<!doctype html><html lang="ko"><meta charset="utf-8"><title>슬롯 첫 표시 검증</title><style>body{margin:0;background:#eee9df;font:15px sans-serif}header{padding:10px;display:flex;gap:10px}button{padding:8px}output{max-width:900px}#view{position:relative;width:1100px;height:550px;margin:10px;overflow:hidden}iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform:scale(.509259);transform-origin:0 0}</style><header><button id="run">느린 연결 검증</button><output id="result">준비</output></header><div id="view"><iframe id="frame" title="실제 슬롯 선택 화면"></iframe></div><script src="./game-data.js"></script><script src="./dialogue-model.js"></script><script src="./monologue-model.js"></script><script src="./game-model.js"></script><script src="./game-store.js"></script><script>
const frame=document.querySelector('#frame'),result=document.querySelector('#result'),sleep=ms=>new Promise(ok=>setTimeout(ok,ms));
async function until(f){for(let i=0;i<400;i++){if(f())return;await sleep(30)}throw Error('화면 준비 시간 초과')}
async function records(){const s=await PixelyGameStore.slots();return JSON.stringify([[...s.manual],[...s.auto]])}
async function seed(){const state=PixelyGameModel.create(PixelyGameData.defaults(),0);state.goal='슬롯 첫 표시 검증';await PixelyGameStore.save(state,'manual');const auto=PixelyGameModel.create(PixelyGameData.defaults(),2);auto.playMs=60000;await PixelyGameStore.save(auto,'auto');const db=await PixelyGameStore.open();await new Promise((ok,no)=>{const t=db.transaction('slots','readwrite');t.objectStore('slots').put({version:1},3);t.oncomplete=ok;t.onabort=()=>no(t.error)});PixelyGameStore.close()}
document.querySelector('#run').onclick=async()=>{let n=0,frames=0;const a=(name,ok)=>{if(!ok)throw Error(name);result.textContent=++n+' · '+name};try{for(const occupied of [false,true]){if(occupied)await seed();const before=await records();for(const mode of ['new','continue']){const previous=frame.contentDocument;frame.src='qa-loading-game.html?mode='+mode;await until(()=>frame.contentDocument!==previous&&frame.contentDocument?.querySelector('#slot-list')&&frame.contentDocument.querySelector('link[href*="game.css"]')?.sheet);const d=frame.contentDocument,win=frame.contentWindow,list=d.querySelector('#slot-list'),original=[...list.children];a('콘텐츠 준비 전 다섯 슬롯 존재',original.length===5&&list.getAttribute('aria-busy')==='true');a('준비 전 시작 금지',d.querySelector('#slot-start').disabled&&original.every(b=>b.disabled));for(let i=0;i<12;i++){const cards=[...list.children];a('대기 중 슬롯 경계 표시',cards.length===5&&cards.every(b=>{const r=b.getBoundingClientRect(),c=win.getComputedStyle(b);return r.width>100&&r.height>40&&c.visibility==='visible'&&Number(c.opacity)===1}));frames++;await sleep(60)}a('인터넷 대기 중 저장 기록 먼저 표시',list.children[0].querySelector('strong').textContent===(occupied?'모험 기록':'빈 일기장'));await until(()=>win.PixelyGame);await win.PixelyGame.ready;a('동일 카드에 내용 업데이트',original.every((b,i)=>list.children[i]===b));a('다섯 슬롯 준비 완료',list.getAttribute('aria-busy')==='false'&&[...list.children].every(b=>!b.disabled));a('모드별 제목',d.querySelector('#slots-title').textContent===(mode==='new'?'새로운 나들이':'이어지는 나들이'));if(occupied){a('수동·자동·손상 기록 표시',list.children[0].textContent.includes('모험 기록')&&list.children[2].textContent.includes('자동')&&list.children[3].textContent.includes('확인이 필요한 기록'));list.children[0].click();a('점유 슬롯 상세와 시작',mode==='new'?d.querySelector('#slot-description').textContent.includes('덮어써'):!d.querySelector('#slot-start').disabled);list.children[3].click();a('손상 기록 이어하기 보호',mode==='new'||d.querySelector('#slot-start').disabled)}list.children[1].click();a('빈 슬롯 선택',d.querySelector('#slot-title').textContent==='나들이 기록 02');a('빈 슬롯 시작 규칙',d.querySelector('#slot-start').disabled===(mode==='continue'));a('슬롯 선택 중 메뉴 비율 유지',!d.documentElement.classList.contains('pixely-game-playing'));a('저장 내용 변경 없음',await records()===before)}}result.textContent=n+' checks passed · '+frames+' loading frames · empty / saved / auto / damaged records';}catch(e){result.textContent='FAIL after '+n+': '+e.message}};
</script></html>
